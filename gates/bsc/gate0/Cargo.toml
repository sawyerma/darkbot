[package]
name = "darkbot-gate0"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1"
alloy-consensus = "=2.0.4"
alloy-sol-types = { version = "1", features = ["more-tuple-impls"] }
alloy-rlp = "=0.3.13"
hex = "0.4"
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }

rustls = "0.23"
webpki-roots = "1"

# Gate-0 BSC P2P sensor. Keep only the standalone network/txpool crates from
# the BNB Chain Reth fork; do not pull the reth-bsc root node crate because
# that drags execution/engine components unrelated to this sensor.
reth-network = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2", features = ["test-utils"] }
reth-storage-api = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-tasks = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-discv4 = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2", features = ["test-utils"] }
reth-chainspec = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-transaction-pool = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2", features = ["test-utils"] }
reth-eth-wire = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-eth-wire-types = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-ethereum-forks = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-network-peers = { git = "https://github.com/bnb-chain/reth.git", tag = "v0.1.2" }
reth-primitives-traits = { git = "https://github.com/bnb-chain/reth-core.git", branch = "v0.3.1-v2", default-features = false }
bytes = "1"
futures = "0.3"
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"

[dev-dependencies]
alloy-rlp = "=0.3.13"
