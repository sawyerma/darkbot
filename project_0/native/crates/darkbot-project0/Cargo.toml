[package]
name = "darkbot-project0"
version = "0.1.0"
edition = "2021"
description = "DarkBot Project 0: protocol glue (P1/P3 via marginfi crate), state engine + indices + schedulers (P2), deterministic economics (P4A), receivership planner (P5), tagger (T)"
license = "UNLICENSED"

# P1B 0.1.12 promotion: official marginfi crates remain the Health/risk source of truth.
# Compiler/unit tests are qualified on the promotion branch; Mainnet Shadow evidence remains
# a separate gate before promotion to main/LIVE.

[features]
default = []
crate_health = ["marginfi", "marginfi-type-crate", "anchor-lang", "dep:fixed", "kamino-mocks", "drift-mocks", "juplend-mocks"]

[dependencies]
darkbot-common = { path = "../darkbot-common" }
darkbot-solana = { path = "../darkbot-solana" }
# BELEGT: marginfi-v2 Workspace pinnt solana-sdk =3.0.0, solana-client =3.1.12, anchor-lang 1.0.2
solana-sdk = "=3.0.0"
bytemuck = "1"
fixed = { version = "=1.28.0", optional = true } # [FIX-59] exact protocol sizing math; matches marginfi lock
anchor-lang = { version = "1.0.2", optional = true }

# P1B pin: 0.1.12 source commit selected for promotion/runtime qualification.
marginfi = { git = "https://github.com/0dotxyz/marginfi-v2", rev = "7d48d8a3bafa8e03e4020d253aaa2ea426dde68e", default-features = false, features = ["client", "no-entrypoint", "mainnet-beta"], optional = true }
marginfi-type-crate = { git = "https://github.com/0dotxyz/marginfi-v2", rev = "7d48d8a3bafa8e03e4020d253aaa2ea426dde68e", default-features = false, features = ["mainnet-beta"], optional = true }

# [FIX-109][R6] Exact integration layouts/builders from the same pinned Marginfi source tree.
# These are already transitive dependencies of marginfi; declaring them directly lets Project_0
# use the canonical zero-copy layouts and generated client instruction accounts without copying IDLs.
kamino-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", rev = "7d48d8a3bafa8e03e4020d253aaa2ea426dde68e", default-features = false, features = ["no-entrypoint"], optional = true }
drift-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", rev = "7d48d8a3bafa8e03e4020d253aaa2ea426dde68e", default-features = false, features = ["no-entrypoint"], optional = true }
juplend-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", rev = "7d48d8a3bafa8e03e4020d253aaa2ea426dde68e", default-features = false, features = ["no-entrypoint"], optional = true }
