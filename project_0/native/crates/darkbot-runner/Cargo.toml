[package]
name = "darkbot-runner"
version = "0.1.0"
edition = "2021"
description = "DarkBot Project 0 runner: Long-Tail pipeline (shadow = send boundary, live = behind safety)"
license = "UNLICENSED"

[features]
default = []
crate_health = ["darkbot-project0/crate_health", "marginfi-type-crate"]
txv1 = ["darkbot-solana/txv1"]

[dependencies]
darkbot-common = { path = "../darkbot-common" }
darkbot-solana = { path = "../darkbot-solana" }
darkbot-project0 = { path = "../darkbot-project0" }
solana-sdk = "=3.0.0"
solana-client = "=3.1.12"
solana-message = "=3.0.1"       # [FIX-13][FIX-39][FIX-49]
solana-commitment-config = "=3.1.1"
solana-transaction-status = "=3.1.12"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] } # [FIX-65] Jupiter Swap V2 /build
bytemuck = "1"
marginfi-type-crate = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.11-rc1", default-features = false, features = ["mainnet-beta"], optional = true }

[[bin]]
name = "p0-longtail"
path = "src/main.rs"
