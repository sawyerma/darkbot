[package]
name = "darkbot-solana"
version = "0.1.0"
edition = "2021"
description = "DarkBot native Solana core: ingress (S1), canonical state (S2), execution core (S3)"
license = "UNLICENSED"

# UNTESTED / VERIFY bis zum Mac-Compilerlauf.
# Project-0/marginfi bleibt auf dem belegten SDK-3.x-Graph. Transaction-v1 wird über
# modulare 4.x-Crates isoliert zugeschaltet; beide Graphen dürfen im selben Workspace leben.

[features]
default = []
# Offline test helpers for dependent crates (loopback gRPC server); never in a release build.
test-support = []
# DEC-09: the historical JSON re-encoders of typed chain evidence (offline view checks only); the
# standard production binary is built without them.
historical = []
txv1 = ["dep:solana-pubkey-v1", "dep:solana-hash-v1", "dep:solana-instruction-v1", "dep:solana-message-v1", "dep:solana-short-vec-v1"]

[dependencies]
darkbot-common = { path = "../common" }

solana-sdk = "=3.0.0"         # BELEGT: marginfi-v2 Workspace-Pin; protocol/v0 path
solana-client = "=3.1.12"     # BELEGT: marginfi-v2 Workspace-Pin
solana-transaction-status = "=3.1.12"  # [FIX-49] marginfi tag Cargo.lock
solana-transaction-status-client-types = "=3.1.12"  # official RPC error format (chain.rs, JFI-02 wire boundary)
# [FIX-13] SDK-3.x: entfernte solana_sdk-Module über Component-Crates. Versionen VERIFY (an den
# marginfi-Graph angleichen: `cargo tree -i solana-message` etc.).
# [FIX-39] `bincode`-Feature für die System-Instruction-Builder (transfer).
# [FIX-49] Component-Crates an den tatsächlich aufgelösten Cargo.lock des Marginfi-Tags angeglichen.
solana-message = "=3.0.1"
solana-commitment-config = "=3.1.1"
solana-compute-budget-interface = "=3.0.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-account-decoder = "=3.1.12"  # [FIX-49] marginfi tag Cargo.lock

# Transaction-v1 capability adapter. These modular crates coexist with the
# marginfi-pinned solana-sdk 3.x graph; only the serializer/message adapter uses them.
# [FIX-48] solana-instruction MUST stay at =3.4.0: marginfi-type-crate pins exactly 3.4.0,
# while solana-message 4.4.1 accepts >=3.4.0,<3.5.0. Pin message exactly as well so a
# future Cargo resolution cannot drift to a newer message release with a different graph.
solana-pubkey-v1 = { package = "solana-pubkey", version = "4.2.1", optional = true }
solana-hash-v1 = { package = "solana-hash", version = "4.3.0", optional = true }
solana-instruction-v1 = { package = "solana-instruction", version = "=3.4.0", optional = true }
solana-message-v1 = { package = "solana-message", version = "=4.4.1", features = ["wincode"], optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }  # VERIFY Version
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
zeroize = "1.9"  # B10: keypair buffers (already in the graph)
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
bincode = "1"   # VERIFY: Wire-Format-Serialisierung der VersionedTransaction
# S1-02: native Yellowstone protobuf decoding (already in the graph; no gRPC/transport crate).
prost = "=0.13.5"
# S1-02 transport: gRPC over HTTP/2 + rustls (ring, as in the graph) with webpki roots.
h2 = "=0.4.19"
http = "1"
bytes = "1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Canonical v1 wincode requires this compatible minor; SDK-3 accepts ^3.0.0.
solana-short-vec-v1 = { package = "solana-short-vec", version = "=3.2.2", optional = true }

async-trait = "0.1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]

[[bin]]
name = "p0-probe-v1"
path = "src/bin/p0-probe-v1.rs"
required-features = ["txv1"]
