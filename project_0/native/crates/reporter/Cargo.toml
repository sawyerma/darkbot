[package]
name = "darkbot-p0-reporter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
darkbot-runner = { path = "../runtime", features = ["crate_health"] }
prost = "0.13"
bytes = "1"
libc = "0.2"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[[bin]]
name = "p0-market-capture-reported"
path = "src/bin/p0_market_capture_reported.rs"

# The Shadow/econ4h runtime: its composition root starts the status reporter when P0_REPORT_SOCKET
# is set (the engine never depends on the reporter crate). One production runtime binary, the one
# the boot admission binds next to p0ctl.
[[bin]]
name = "p0-longtail"
path = "src/bin/p0_longtail.rs"

# B03/U-9: the standalone Project 0 analytics publisher (project0.analytics.jobs).
[[bin]]
name = "p0-analytics-reporter"
path = "src/bin/p0_analytics_reporter.rs"

[features]
test-fixture = []
# Pass-through of the runtime's features (launchers build with "crate_health txv1").
crate_health = ["darkbot-runner/crate_health"]
txv1 = ["darkbot-runner/txv1"]

[[bin]]
name = "p0-reporter-fixture"
path = "src/bin/p0_reporter_fixture.rs"
required-features = ["test-fixture"]
