[package]
name = "darkbot-p0-reporter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
darkbot-runner = { path = "../runtime", features = ["crate_health"] }
prost = "0.13"
bytes = "1"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[[bin]]
name = "p0-market-capture-reported"
path = "src/bin/p0_market_capture_reported.rs"

[features]
test-fixture = []

[[bin]]
name = "p0-reporter-fixture"
path = "src/bin/p0_reporter_fixture.rs"
required-features = ["test-fixture"]
