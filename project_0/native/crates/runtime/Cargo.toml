[package]
name = "darkbot-runner"
version = "0.1.0"
edition = "2021"
description = "DarkBot Project 0 runner: Long-Tail pipeline (shadow = send boundary, live = behind safety)"
license = "UNLICENSED"

[features]
default = []
crate_health = ["darkbot-project0/crate_health", "marginfi-type-crate", "kamino-mocks", "drift-mocks", "juplend-mocks"]
txv1 = ["darkbot-solana/txv1"]
# DEC-09: historical JSON readers (schema-1 views, legacy renders, pre-binary imports) for offline
# tools only; the standard production binary is built without them.
historical = ["darkbot-solana/historical"]

# DEC-09: the A4 parity differential reads historical raw JSON sources only.
[[bin]]
name = "p0-parity"
path = "src/bin/p0-parity.rs"
required-features = ["historical"]

# DEC-08: the pinned INDEX parity gate runs the pinned Python verifier against `p0-parity`.
[[test]]
name = "dec08_index_parity"
required-features = ["historical"]

[dependencies]
darkbot-common = { path = "../common" }
darkbot-solana = { path = "../solana" }
darkbot-project0 = { path = "../liquidation" }
solana-sdk = "=3.0.0"
solana-client = "=3.1.12"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-message = "=3.0.1"       # [FIX-13][FIX-39][FIX-49]
solana-commitment-config = "=3.1.1"
solana-transaction-status = "=3.1.12"
bs58 = "0.5"
# SK-03: physical memory and peak RSS for the capture byte budget (sysconf/getrusage).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# [FIX-120] Protocol Health uses I80F48 bits (i128). json! must preserve the entire
# integer range rather than panic beyond u64/i64 or round through floating point.
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] } # [FIX-65] Jupiter Swap V2 /build
rayon = "1" # [R127c] CPU-parallel exact-health batch admission (eva01-style)
bytemuck = "1"
bincode = "1.3"
spl-associated-token-account = { version = "8.0.0", default-features = false, features = ["no-entrypoint"] }
marginfi-type-crate = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.12-rc2", default-features = false, features = ["mainnet-beta"], optional = true }
# [FIX-112f][R6] Runner directly decodes the same pinned integration layouts used by
# darkbot-project0 when constructing venue-specific withdraw account metas.
kamino-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.12-rc2", default-features = false, features = ["no-entrypoint"], optional = true }
drift-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.12-rc2", default-features = false, features = ["no-entrypoint"], optional = true }
juplend-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.12-rc2", default-features = false, features = ["no-entrypoint"], optional = true }

[dev-dependencies]
# R1: loopback WebSocket peer for the capture end-to-end test (same version the WSS adapter uses).
tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }
# S1-02: the loopback gRPC server of the owner's source E2E tests.
darkbot-solana = { path = "../solana", features = ["test-support"] }

