[package]
name = "darkbot-project0"
version = "0.1.0"
edition = "2021"
description = "DarkBot Project 0: protocol glue (P1/P3 via marginfi crate), state engine + indices + schedulers (P2), deterministic economics (P4A), receivership planner (P5), tagger (T)"
license = "UNLICENSED"

# Feature `crate_health` bindet `marginfi` (Apache-2.0, Tag mrgn-0.1.11-rc1, Protokoll-Pin 33c67987) als einzige
# Health-Engine ein (`health::crate_impl::CrateHealth`); keine eigene Health-Formel. kamino-/drift-/juplend-mocks sind
# trotz des Namens die Integrations-Kontolayouts des marginfi-v2-Programms selbst (Kamino Reserve, Drift SpotMarket/User,
# JupLend Lending), die für die Bewertung realer Integrationskonten benötigt werden. Ohne das Feature gibt es keine
# Health-Engine; das Binary p0-longtail verlangt es (`required-features`).

[features]
default = []
crate_health = ["marginfi", "marginfi-type-crate", "anchor-lang", "dep:fixed", "kamino-mocks", "drift-mocks", "juplend-mocks"]

[dependencies]
darkbot-common = { path = "../common" }
darkbot-solana = { path = "../solana" }
# BELEGT: marginfi-v2 Workspace pinnt solana-sdk =3.0.0, solana-client =3.1.12, anchor-lang 1.0.2
solana-sdk = "=3.0.0"
bytemuck = "1"
serde = { version = "1", features = ["derive"] } # typed binary census payloads (JFI-01)
fixed = { version = "=1.28.0", optional = true } # [FIX-59] exact protocol sizing math; matches marginfi lock
anchor-lang = { version = "1.0.2", optional = true }

# VERIFY: Tag = deployed Mainnet-Version aus P1A-01 (erwartet mrgn-0.1.11-rc1, nach Upgrade 0.1.12).
# BELEGT (Sitzung 4): Programm-Crate main = 0.1.11, features client/no-entrypoint/mainnet-beta; Type-Crate 0.1.10.
marginfi = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.11-rc1", default-features = false, features = ["client", "no-entrypoint", "mainnet-beta"], optional = true }
marginfi-type-crate = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.11-rc1", default-features = false, features = ["mainnet-beta"], optional = true }

# [FIX-109][R6] Exact integration layouts/builders from the same pinned Marginfi source tree.
# These are already transitive dependencies of marginfi; declaring them directly lets Project_0
# use the canonical zero-copy layouts and generated client instruction accounts without copying IDLs.
kamino-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.11-rc1", default-features = false, features = ["no-entrypoint"], optional = true }
drift-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.11-rc1", default-features = false, features = ["no-entrypoint"], optional = true }
juplend-mocks = { git = "https://github.com/0dotxyz/marginfi-v2", tag = "mrgn-0.1.11-rc1", default-features = false, features = ["no-entrypoint"], optional = true }
