[package]
name = "darkbot-runner"
description = "DarkBot BSC runner: transport, provider framing and execution of submissions. Decides no quote, nonce or strategy; those are darkbot-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Always without features: the production build of the runner uses the core
# as it is.
darkbot-core = { path = "../core", features = ["runner-startup"] }
rustls = { workspace = true }
webpki-roots = { workspace = true }
alloy-primitives = { workspace = true }

# G0.7 qualification support. Optional: the production runner build has none
# of these; only the qualification features below pull them in.
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
darkbot-capture = { path = "../capture", optional = true }
alloy-sol-types = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }

[features]
default = []
# The frozen v2 acceptance guard of G0.7 (read-only, fail-closed, compiled
# UNARMED). Its check interface is available to the qualification tools.
acceptance-guard = ["dep:serde_json", "dep:sha2", "dep:hex"]
# The controlled G0.7 Mainnet self-launch + BUY path: guard, bounded capture
# and the strictly separate g07 binary. Never enabled by the production build.
g07-mainnet = ["acceptance-guard", "dep:darkbot-capture", "dep:alloy-sol-types", "dep:k256"]

[dev-dependencies]
# The core's test helpers, for this crate's tests only.
darkbot-core = { path = "../core", features = ["test-support"] }
alloy-primitives = { workspace = true }

[[test]]
name = "acceptance_guard"
required-features = ["acceptance-guard"]

# The controlled G0.7 Mainnet self-launch + BUY qualification binary. Strictly
# separate from the production runner: built only with `g07-mainnet`, guarded
# by the compiled-in (UNARMED) v2 acceptance hash. Run from the repository root.
[[bin]]
name = "g07_mainnet_self_launch_buy"
required-features = ["g07-mainnet"]

[[test]]
name = "g07_no_send"
required-features = ["g07-mainnet"]
