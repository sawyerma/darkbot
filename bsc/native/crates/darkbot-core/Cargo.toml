[package]
name = "darkbot-core"
description = "DarkBot BSC runtime core: the single implementation of transaction construction and signing used by replay, PAPER, shadow and LIVE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
darkbot-wire = { path = "../darkbot-wire" }
alloy-primitives = { workspace = true }
k256 = { workspace = true }

[features]
default = []
# Makes the crate's test helpers available to the tests of dependent crates.
# Enable it only under [dev-dependencies]. Never in a production build.
test-support = []
# Exposes only the production ArmedFence constructor consumed by the
# darkbot-runner Unit-6 durable startup path. No I/O is added to core.
runner-startup = []
