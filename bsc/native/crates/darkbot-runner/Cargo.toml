[package]
name = "darkbot-runner"
description = "DarkBot BSC runner: transport, provider framing and execution of submissions. Decides no quote, nonce or strategy; those are darkbot-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Always without features: the production build of the runner uses the core
# as it is.
darkbot-core = { path = "../darkbot-core" }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
# The core's test helpers, for this crate's tests only.
darkbot-core = { path = "../darkbot-core", features = ["test-support"] }
alloy-primitives = { workspace = true }
