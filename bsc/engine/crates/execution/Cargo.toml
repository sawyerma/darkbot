[package]
name = "darkbot-bsc-execution"
description = "DarkBot BSC execution: transport, provider framing and execution of submissions. Decides no quote, nonce or strategy; those are darkbot-bsc-trading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Always without features: the production build of the runner uses the core
# as it is.
darkbot-bsc-trading = { path = "../trading", features = ["runner-startup"] }
rustls = { workspace = true }
webpki-roots = { workspace = true }
alloy-primitives = { workspace = true }

# G0.7 qualification support. Optional: the production runner build has none
# of these; only the qualification features below pull them in.
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
darkbot-bsc-journal = { path = "../journal", optional = true }
darkbot-bsc-record = { path = "../record", optional = true }
alloy-sol-types = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
zeroize = { version = "=1.9.0", optional = true }
# The runtime's native WSS pending-transaction source (`wss`): the WebSocket
# client handshake and framing only (TLS is the rustls above), the canonical
# RLP writers, and the independent envelope decoder for the cross-check.
tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"], optional = true }
darkbot-bsc-tx-encoding = { path = "../tx_encoding", optional = true }
darkbot-bsc-geth-ipc = { path = "../geth_ipc", optional = true }
# The source's signer recovery for every full transaction (BSC3-063).
secp256k1 = { workspace = true, optional = true }
# SIGTERM/SIGINT of the runtime process become its stop request (a safe
# signal iterator; the crate forbids unsafe code).
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"], optional = true }

[features]
default = []
# The binary v3 acceptance guard of G0.7 (read-only, fail-closed, compiled
# UNARMED) and the contract it checks. Its check interface is available to
# the qualification tools. No JSON: the contract is a DBREC001 record.
acceptance-guard = ["dep:darkbot-bsc-record"]
# The controlled G0.7 Mainnet self-launch + BUY path: guard, bounded capture
# and the strictly separate g07 binary. Never enabled by the production build.
# serde_json only decodes external JSON-RPC responses at the transport
# boundary into typed values; nothing internal is JSON.
# JSON-RPC over curl with the endpoint and request on stdin, never argv.
rpc-wire = []
# The BSC runtime's native configuration owners (C0/C1): binary records only.
# serde_json only at the WSS source's JSON-RPC wire (`wss::jsonrpc`).
runtime = ["dep:darkbot-bsc-record", "dep:tungstenite", "dep:serde_json", "dep:darkbot-bsc-tx-encoding", "dep:darkbot-bsc-geth-ipc", "dep:darkbot-bsc-journal", "dep:signal-hook", "dep:zeroize", "dep:sha2", "dep:secp256k1"]
g07-mainnet = ["acceptance-guard", "rpc-wire", "dep:serde_json", "dep:sha2", "dep:hex", "dep:darkbot-bsc-journal", "dep:alloy-sol-types", "dep:k256", "dep:zeroize"]

[lints.rust]
# BSC3-063 review: under `secp256k1_fuzz` libsecp256k1 recovers a key from
# the signature bytes alone; the source refuses to build so (`wss::verify`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(secp256k1_fuzz)"] }

[dev-dependencies]
# The core's test helpers, for this crate's tests only.
darkbot-bsc-trading = { path = "../trading", features = ["test-support"] }
alloy-primitives = { workspace = true }
darkbot-bsc-record = { path = "../record" }
# BSC3-063: the core's k256 signatures the source's recovery is held against.
k256 = { workspace = true }
# BSC3-023: what an admission asks of the drive, in this crate's tests.
darkbot-bsc-journal = { path = "../journal", features = ["test-hooks"] }

[[test]]
name = "acceptance_guard"
required-features = ["acceptance-guard"]

# Writes the binary acceptance contract of G0.7 attempt 1 from its reviewed
# source values (offline; run from the repository root).
[[bin]]
name = "g07_acceptance_contract"
required-features = ["acceptance-guard"]

# The controlled G0.7 Mainnet self-launch + BUY qualification binary. Strictly
# separate from the production runner: built only with `g07-mainnet`, guarded
# by the compiled-in (UNARMED) v3 acceptance hash. Run from the repository root.
[[bin]]
name = "g07_mainnet_self_launch_buy"
required-features = ["g07-mainnet"]

[[test]]
name = "g07_no_send"
required-features = ["g07-mainnet"]

# Requalification DRY-0/R0: the current preflight and the Portal upgrade
# scan as binary records (read-only RPC only).
[[bin]]
name = "g06a_preflight_record"
required-features = ["g07-mainnet"]

# G0.7 pre-arm checks 6 and 10: the builder probe with non-executable bundles.
# A dry run by default; it sends only an approved plan (plan SHA-256), once.
[[bin]]
name = "g07_builder_probe"
required-features = ["g07-mainnet"]

[[test]]
name = "g07_builder_probe"
required-features = ["g07-mainnet"]

[[bin]]
name = "g07_pre_live_readiness"
required-features = ["g07-mainnet"]

# G0.7 self-launch candidates A/B (plan v8/v9): offline, no RPC, key or send.
[[bin]]
name = "g07_candidate"
required-features = ["g07-mainnet"]

# G0.6a DRY secret/evidence handoffs (plan v9.1 D1-D3): offline, no RPC,
# key read or send; the SELF_B salt only to allowlisted local consumers.
[[bin]]
name = "g06a_dry_handoff"
required-features = ["g07-mainnet"]

[[bin]]
name = "g07_attempt_authority"
required-features = ["g07-mainnet"]

[[test]]
name = "g07_attempt_authority"
required-features = ["g07-mainnet"]

[[test]]
name = "g07_readiness"
required-features = ["g07-mainnet"]

[[test]]
name = "g07_candidate"
required-features = ["g07-mainnet"]

# The BSC runtime (C0/C1): source modes now; ingress, journal and status follow.
[[bin]]
name = "bsc_runtime"
required-features = ["runtime"]

[[test]]
name = "runtime_signal"
required-features = ["runtime"]

[[test]]
name = "bsc_tools"
required-features = ["g07-mainnet", "runtime"]

# Plan 28.10. package 8: the synthetic, guaranteed non-sending LIVE E2E.
[[test]]
name = "live_e2e"
required-features = ["runtime"]
