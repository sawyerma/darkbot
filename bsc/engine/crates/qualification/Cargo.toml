[package]
name = "darkbot-bsc-qualification"
description = "DarkBot BSC qualification harnesses. Measures the frozen production types on the real network and writes evidence; decides and sends nothing that could execute."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The frozen production transport, as it is.
darkbot-bsc-execution = { path = "../execution", features = ["acceptance-guard"] }
# G0.6a DRY / G0.8 read-only qualification binaries (migrated from Gate-0).
# The quote arithmetic is the core's; the v2 check is the runner's guard.
darkbot-bsc-trading = { path = "../trading" }
darkbot-bsc-journal = { path = "../journal" }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
k256 = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# SHA-256 of request bodies. Already locked through rustls; without default
# features, so that the production build's features stay as they are.
ring = { version = "=0.17.14", default-features = false }

[dev-dependencies]
# A loopback TLS server for the offline end-to-end tests.
rustls = { workspace = true }
