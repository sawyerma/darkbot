[package]
name = "darkbot-bsc-qualification"
description = "DarkBot BSC qualification harnesses. Measures the frozen production types on the real network and writes evidence; decides and sends nothing that could execute."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The frozen production transport, as it is.
darkbot-bsc-execution = { path = "../execution", features = ["acceptance-guard", "rpc-wire", "runtime"] }
# G0.6a DRY / G0.8 read-only qualification binaries (migrated from Gate-0).
# The quote arithmetic is the core's; the v2 check is the runner's guard.
darkbot-bsc-trading = { path = "../trading" }
darkbot-bsc-journal = { path = "../journal" }
# G0.7 evidence, G0.8 results, witness and chain capture payloads (DBREC001).
darkbot-bsc-record = { path = "../record" }
# The C1.9 report reads the Fast-Lane outbound status codes of the raw
# evidence (already built through the execution runtime feature).
darkbot-bsc-geth-ipc = { path = "../geth_ipc" }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
k256 = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# SHA-256 of request bodies. Already locked through rustls; without default
# features, so that the production build's features stay as they are.
ring = { version = "=0.17.14", default-features = false }

prost = { version = "=0.13.5", optional = true }
# Audit E 4.13: the readiness job's stop handler (forwards TERM/INT to its
# run's process group), as bsc_runtime's, at the version this lock resolved.
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"], optional = true }

[build-dependencies]
prost-build = { version = "=0.13.5", optional = true }
protox = { version = "=0.7.2", optional = true }

[dev-dependencies]
# A loopback TLS server for the offline end-to-end tests.
rustls = { workspace = true }
# The execution crate's test helpers (a test CA's trust, an attempt under a grant).
darkbot-bsc-execution = { path = "../execution", features = ["test-support"] }

[features]
default = []
status-reporter = ["dep:prost", "dep:prost-build", "dep:protox", "dep:signal-hook"]

[[bin]]
name = "bsc-status-reporter"
required-features = ["status-reporter"]

[[test]]
name = "bsc_tools"
required-features = ["status-reporter"]

# Audit E 4.13: the readiness job's one native owner, end to end.
[[test]]
name = "readiness_job"
required-features = ["status-reporter"]

# BSC-V8: the reporter's read-only `--query` arm, end to end.
[[test]]
name = "bsc_query"
required-features = ["status-reporter"]
