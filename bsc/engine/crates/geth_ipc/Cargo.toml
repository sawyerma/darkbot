[package]
name = "darkbot-bsc-geth-ipc"
description = "DarkBot C1 bidirectional mmap/SPSC Fast-Lane wire and Rust endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = { workspace = true }
# The economic egress capability (`intent::EgressWrite`, E6-2). No feature:
# the generic core only.
darkbot-bsc-trading = { path = "../trading" }
# The C1.6 host profile and the C1.9/C1.9b raw evidence as typed binary
# records (DBREC001) and tables; no cycle: the record crate depends on sha2 only.
darkbot-bsc-record = { path = "../record" }

[dev-dependencies]
# `IntentLane::dispatched_for_tests` for the egress tests and the C1.9
# measurement harness (examples). Never a production dependency.
darkbot-bsc-trading = { path = "../trading", features = ["test-support"] }
alloy-primitives = { workspace = true }
