[package]
name = "darkbot-bsc-trading"
description = "DarkBot BSC runtime core: the single implementation of transaction construction and signing used by replay, PAPER, shadow and LIVE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
darkbot-bsc-tx-encoding = { path = "../tx_encoding" }
alloy-primitives = { workspace = true }
k256 = { workspace = true }
# BSC3-063 / Audit E 4.15, 5.5: every signer recovery (libsecp256k1); k256
# signs, and stays the recovery's reference in the differential tests.
secp256k1 = { workspace = true }

[features]
default = []
# Makes the crate's test helpers available to the tests of dependent crates.
# Enable it only under [dev-dependencies]. Never in a production build.
test-support = []
# Exposes only the production ArmedFence constructor consumed by the
# darkbot-bsc-execution Unit-6 durable startup path. No I/O is added to core.
runner-startup = []

[lints.rust]
# BSC3-063 review: under `secp256k1_fuzz` libsecp256k1 recovers a key from
# the signature bytes alone; the core refuses to build so (`signer`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(secp256k1_fuzz)"] }
