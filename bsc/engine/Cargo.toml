# DarkBot BSC native production workspace (Runtime Contract §16).
#
# Members are added only when they contain production code. No placeholder
# crates. Release-profile tuning (LTO, codegen-units, panic strategy) is
# deliberately absent: Runtime Contract §10 requires each setting to be
# benchmarked on the target host before it is retained.
#
# Reproducibility: the compiler is pinned in rust-toolchain.toml, the direct
# wire- and signature-relevant dependencies are pinned to exact versions here,
# and Cargo.lock is committed. Build, test and lint with `--locked`.
[workspace]
resolver = "3"
members = [
    "crates/tx_encoding",
    "crates/trading",
    "crates/execution",
    "crates/qualification",
    "crates/journal",
    "crates/geth_ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
# Exactly the versions resolved by the qualified Gate-0 harness and by the
# Unit-1 review run (2026-10-03).
alloy-primitives = "=1.7.3"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
# TLS of the builder transports (Unit 5). The versions the Gate-0 harness
# resolved and locked (prestudy/bsc/experiments/gate0/Cargo.lock), with the ring crypto
# provider instead of the default aws-lc-rs, and without logging.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
libc = "=0.2.189"
# G0.7/G0.8 qualification support (migrated from the retired Gate-0 harness,
# exactly the versions its Cargo.lock resolved). Used only behind the
# qualification features of darkbot-runner and by darkbot-qualify.
serde_json = "=1.0.151"
sha2 = "=0.10.9"
hex = "=0.4.3"
alloy-sol-types = { version = "=1.7.3", features = ["more-tuple-impls"] }
