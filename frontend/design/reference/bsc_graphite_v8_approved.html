/* Verdichtete BSC-Informationsarchitektur: genau ein Onzeigeort je Detail. */
.system-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:0 8px}
.system-metric{padding:18px 17px;min-width:0;border-right:1px solid var(--edge2)}
.system-metric:last-child{border-right:0}
.system-metric .name{display:block;color:var(--muted);font-size:11px;min-height:29px}
.system-metric strong{display:block;font-size:21px;font-weight:640;letter-spacing:-.5px;margin-top:5px}
.system-metric .unit{font-size:12px;color:var(--muted);font-weight:500}
.dashboard-jump{display:flex;gap:18px;align-items:center;justify-content:space-between;min-height:104px}
.dashboard-jump p{margin:5px 0 0;font-size:12px}
.mini-steps{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}
.mini-steps strong{color:var(--text);font-size:12px}
.workspace-back{border:0;background:transparent;color:var(--muted);padding:5px 0 12px;display:inline-flex;align-items:center;gap:6px;font-size:12px}
.workspace-back:hover{color:var(--text)}
.workspace-hero{padding:22px 24px}
.workspace-metrics{display:flex;gap:26px;flex-wrap:wrap}
.workspace-metrics>div{min-width:115px}
.workspace-metrics small{display:block;color:var(--muted);font-size:11px}
.workspace-metrics b{display:block;font-size:19px;letter-spacing:-.4px;margin-top:3px}
.inline-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.compact-live-metrics{display:flex;gap:0;flex-wrap:wrap;margin:0 0 15px;padding:0 5px}
.compact-live-metrics>div{padding:5px 21px 5px 0;margin-right:21px;border-right:1px solid var(--edge)}
.compact-live-metrics>div:last-child{border-right:0}
.compact-live-metrics span{font-size:11px;color:var(--muted);display:block}
.compact-live-metrics strong{display:block;font-size:16px;margin-top:3px}
.monitor-mini{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px}
.monitor-mini span{display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.monitor-mini strong{color:var(--text);font-weight:600}
.slim-details{border:1px solid var(--edge);border-radius:var(--rad);background:var(--panel);overflow:hidden}
.slim-details>summary{padding:18px 22px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;font-weight:630}
.slim-details>summary::-webkit-details-marker{display:none}
.slim-details>summary:after{content:'+';font-size:20px;font-weight:400;color:var(--muted)}
.slim-details[open]>summary:after{content:'−'}
.slim-details>div{padding:2px 22px 21px}
.module-card-open{border:0;background:none;color:inherit;text-align:left;flex:1;min-width:0;cursor:pointer;display:flex;gap:16px;align-items:center;padding:4px 0}
.module-card-open:hover .modname{color:var(--mint)}
.single-divider{border-top:1px solid var(--edge2);margin:18px 0}
@media(max-width:1050px){.system-strip{grid-template-columns:repeat(3,minmax(0,1fr))}.system-metric:nth-child(3){border-right:0}.system-metric:nth-child(n+4){border-top:1px solid var(--edge2)}}
@media(max-width:660px){.system-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.system-metric:nth-child(3){border-right:1px solid var(--edge2)}.system-metric:nth-child(2n){border-right:0}.system-metric:nth-child(n+3){border-top:1px solid var(--edge2)}.dashboard-jump{align-items:flex-start;flex-direction:column;gap:15px}.compact-live-metrics>div{margin-bottom:9px}.workspace-metrics{gap:18px}.monitor-mini{gap:10px}}
@media(max-width:660px){.system-metric:last-child{grid-column:span 2}.topline{flex-wrap:wrap}.segment button{white-space:nowrap;padding:7px 9px}.workspace-metrics>div{min-width:105px}}

/* Ergänzungen: vorhandener Graphite-Stil, Details erst bei Bedarf. */
.filter-editor{margin-top:15px;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.filter-editor>summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:630;display:flex;justify-content:space-between;gap:10px;align-items:center}
.filter-editor>summary::-webkit-details-marker{display:none}
.filter-editor>summary::after{content:'+';font-size:19px;color:var(--muted);font-weight:400}
.filter-editor[open]>summary::after{content:'−'}
.filter-editor-body{padding:0 14px 13px;border-top:1px solid var(--edge2)}
.filter-group{margin-top:15px}.filter-group h4{font-size:12px;color:var(--text);font-weight:620;margin:0 0 9px}

`;

function moduleChart(m,period){
 const end=m.result,series=[0,.14,.11,.31,.29,.52,.48,.7,.66,1].map(v=>v*end);
 if(period==='30T')series.unshift(0);if(period==='All')series.unshift(0,0);
 const w=650,h=195,pad=25,lo=Math.min(0,...series),hi=Math.max(.001,...series),range=hi-lo||1;
 const x=i=>pad+(w-2*pad)*i/(series.length-1),y=v=>h-26-(v-lo)/range*(h-48);
 const path=series.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
 return `<svg class="chart" viewBox="0 0 650 195" preserveAspectRatio="none" role="img" aria-label="Testverlauf for ${e(m.name)}, Demo data"><line x1="25" x2="625" y1="${y(0)}" y2="${y(0)}"/><path d="${path}" class="curve"/><circle class="point" r="5" cx="${x(series.length-1)}" cy="${y(end)}"/><text x="25" y="190">Start</text><text x="625" y="190" text-anchor="end">Latest</text></svg>`;
}

function getFilteredTrades(){
 const q=state.historySearch.toLowerCase().trim();
 return demoTrades.filter(t=>{
  const matches=state.historyFilter==='all'||t.status===state.historyFilter||state.historyFilter==='win'&&t.status==='closed'&&t.result>0||state.historyFilter==='loss'&&t.status==='closed'&&t.result<0;
  const timeMatches=state.historyTime==='all'||(state.historyTime==='today'?t.date.slice(0,10)==='06.11.2026':new Date(t.date.slice(6,10)+'-'+t.date.slice(3,5)+'-'+t.date.slice(0,2))>=new Date('2026-10-31'));
  return matches&&(state.historyMarket==='all'||t.venue===state.historyMarket)&&timeMatches&&(!q||[t.token,t.hash,t.lot,t.venue].some(v=>v.toLowerCase().includes(q)));
 });
}
function tradeStamp(t){
 const d=t.date;return new Date(d.slice(6,10)+'-'+d.slice(3,5)+'-'+d.slice(0,2)+'T'+d.slice(13)+':00').getTime()||0;
}
function tradeCell(t,id){
 const x=demoAttemptMetrics[t.id]||{};
 const clock=v=>v?`${e(dateOndTime(v)[1]||'—')}<span class="tdmuted">${e(dateOndTime(v)[0]||'')}</span>`:'—';
 const list={
  token:`<strong>${e(t.token)}</strong><span class="tdmuted">${e(t.venue)}</span>`,
  status:tradeShortBadge(t),
  market:e(t.venue),
  invest:`${fmt(t.stake,3)} BNB`,
  pnl:t.result===null?'—':amount(t.result),
  roi:t.result===null?'—':fmt(100*t.result/t.stake,1)+' %',
  buy:clock(t.date),sell:clock(tradeSellTime(t)),
  hold:tradeHold(t)===null?'—':tradeHold(t)+' s',
  source:e(x.trigger||'—'),
  lead:x.aheadMs==null?'—':fmt(x.aheadMs,1)+' ms',
  send:x.sendMs==null?'—':fmt(x.sendMs,2)+' ms',
  ack:x.ackMs==null?'—':fmt(x.ackMs,2)+' ms',
  gas:t.gas==null?'—':fmt(t.gas,3)+' BNB',
  placement:e(x.placement||'—'),
  exit:t.status==='closed'?e(t.exit):'—',
  tx:`<span class="mono">${e(t.hash.slice(0,10))}…</span>`
 };
 const classes=['invest','pnl','roi','lead','send','ack','gas','hold'].includes(id)?'right nowrap ':'';
 const sign=id==='pnl'||id==='roi'?t.result>0?'up':t.result<0?'down':'':'';
 return `<td class="trade-col-${id} ${classes}${sign}" data-label="${e(tradeColumnName(id))}">${list[id]||'—'}</td>`;
}
function historyTable(){
 const order={open:0,unknown:1,closed:2,failed:3};
 const data=getFilteredTrades().sort((a,b)=>(order[a.status]??4)-(order[b.status]??4)||tradeStamp(b)-tradeStamp(a));
 const shown=Math.min(data.length,state.historyPage*6),entries=data.slice(0,shown);
 const open=data.filter(t=>t.status==='open').length,pend=data.filter(t=>t.status==='unknown').length;
 const wins=data.filter(t=>t.status==='closed'&&t.result>0).length,losses=data.filter(t=>t.status==='closed'&&t.result<0).length;
 const cols=state.tradeColumns;
 return `<div class="trade-summary"><span><i class="trade-dot open"></i>${open} RUN</span><span><i class="trade-dot unknown"></i>${pend} PEND</span><span><i class="trade-dot closed"></i>${wins} WIN</span><span><i class="trade-dot loss"></i>${losses} LOSS</span><span class="tiny">Active first · demo data</span></div>
 <div class="table-wrap trade-flow-wrap"><table class="trade-flow-table"><thead><tr>${cols.map(id=>`<th class="${['invest','pnl','roi','lead','send','ack','gas','hold'].includes(id)?'right':''}">${e(TRADE_COLUMNS.find(c=>c.id===id)?.short||id)}</th>`).join('')}<th></th></tr></thead>
 <tbody>${entries.map(t=>`<tr data-action="trade-details" data-id="${t.id}" data-open tabindex="0" role="button">${cols.map(id=>tradeCell(t,id)).join('')}<td class="trade-row-action">${icon('chevron','s')}</td></tr>`).join('')||`<tr><td colspan="${cols.length+1}"><div class="empty">No matching trades.</div></td></tr>`}</tbody></table></div>
 <p class="tiny trade-footnote">*Lead is relative to the block header timestamp, not an exact block production time. Click a trade for timing, placement, fees and transactions. All values are examples.</p>
 <div class="table-footer"><span>${shown} of ${data.length} trades</span>${shown<data.length?button('Show more','history-more','btn sm quiet'):''}</div>`;
}

}

 const runMode=String(data.get('runMode')||'duration'),runHours=String(data.get('runHours')||'1'),runCount=String(data.get('runCount')||'100');
 if(!['duration','iterations','continuous'].includes(runMode)||runMode==='duration'&&(!(Number(runHours)>0)||Number(runHours)>168)||runMode==='iterations'&&(!Number.isInteger(Number(runCount))||Number(runCount)<1||Number(runCount)>1000000)){toast('Invalid test duration or launch count.');return null;}
 return {name,market:String(data.get('market')||'Flap'),stake:String(data.get('stake')).replace(',','.'),target:String(data.get('target')).replace(',','.'),stop:String(data.get('stop')).replace(',','.'),hold:String(data.get('hold')).replace(',','.'),observationSec:String(data.get('observationSec')).replace(',','.'),firstBuyerWindow:String(buyerWindow),creatorSoldBeforeFill:String(data.get('creatorSoldBeforeFill')||'FREE_CANCEL'),runMode,runHours,runCount,filters};
}
function saveModule(silent=false){const form=document.getElementById('module-form');if(!form)return false;const values=readStrategyForm(form);if(!values)return false;
 const id=Number(new FormData(form).get('id'));if(id){const m=state.modules.find(m=>m.id===id);if(!m||m.running){toast('A running module cannot be edited.');return false;}Object.assign(m,values);}
 else{const id=state.nextModule++;state.modules.push({id,...values,running:false,result:0,orders:0,win:0,evaluated:0,rejected:0,incomplete:0,color:'green'});state.trainingModule=id;state.view='training';}
 persistDemo();if(!silent){closeLayer();render();toast('Module settings saved (local draft).');}return true;
}
function updateRunInputs(){const f=document.getElementById('module-form'),sel=f?.querySelector('[data-run-selector]');if(!sel)return;for(const [mode,selector] of [['duration','[data-run-duration]'],['iterations','[data-run-iterations]']]){const el=f.querySelector(selector);if(el){el.style.display=sel.value===mode?'':'none';el.querySelectorAll('input').forEach(inp=>inp.disabled=sel.value!==mode);}}}
function runModule(id){const m=state.modules.find(x=>x.id===Number(id));if(!m)return; if(m.running){m.running=false;persistDemo();render();toast('Demo test stopped.');return;}
 if(state.trainingModule===m.id&&!saveModule(true))return;
 state.modules.forEach(x=>x.running=false);m.running=true;m.startedAt=Date.now();
 persistDemo();render();toast(`Test configuration saved. ${m.runMode==='iterations'?m.runCount+' Starts':m.runMode==='duration'?m.runHours+' h':'Bis Stop'} – Demo only; no execution.`);
}


function restoreTradeColumns(){try{const x=JSON.parse(localStorage.getItem('bsc_trade_columns_v8')||'null');if(Array.isArray(x)){const valid=safeColumns(x);if(valid.includes('token')&&valid.length>0)state.tradeColumns=valid;}}catch{}}
function saveTradeColumns(){try{localStorage.setItem('bsc_trade_columns_v8',JSON.stringify(state.tradeColumns));}catch{}}
restoreTradeColumns();
function tradeColumnPicker(){
 const columns=state.columnDraft||state.tradeColumns.slice();
 const selected=new Set(columns);
 const rest=TRADE_COLUMNS.filter(c=>!selected.has(c.id));
 const rows=[...columns.map(id=>TRADE_COLUMNS.find(c=>c.id===id)).filter(Boolean),...rest];
 showLayer('Trade columns','PERSONALIZE',`<p class="small">Choose which fields appear in the trade list. Drag-free ordering with arrows; settings are saved in this browser.</p><div class="column-choices">${rows.map(c=>{const on=selected.has(c.id),at=columns.indexOf(c.id);return `<div class="column-choice"><label class="check-label"><input type="checkbox" data-col-select="${c.id}" ${on?'checked':''} ${c.id==='token'?'disabled':''}><span>${e(c.label)}</span></label><div class="column-controls"><button type="button" data-action="col-up" data-id="${c.id}" title="Move up" aria-label="Move ${e(c.label)} up" ${!on||at<=0?'disabled':''}>↑</button><button type="button" data-action="col-down" data-id="${c.id}" title="Move down" aria-label="Move ${e(c.label)} down" ${!on||at===columns.length-1?'disabled':''}>↓</button></div></div>`}).join('')}</div><p class="tiny mt">Token is always visible. Select any additional fields, including buy/sell timestamps, investment, PnL and latency.</p>`,`${button('Defaults','col-default','btn quiet')}${button('Cancel','close','btn quiet')}${button('Apply','col-apply','btn primary')}`,true);
}
function refreshColumnPicker(){tradeColumnPicker();}

/* V8: demo-only handlers retained from earlier UI actions. Never broadcast transactions. */
function saveLiveManual(){
 const values=readStrategyForm(document.getElementById('live-manual-form'));
 if(!values)return;
 state.liveManual={...state.liveManual,...values,name:'Custom settings',running:false};
 persistDemo();render();toast('Custom Live settings saved as a local draft.');
}
function importLiveManual(){
 const source=state.modules.find(m=>m.id===state.liveProfile)||state.modules[0];
 if(!source){toast('Create a training module first.');return;}
 state.liveManual={...structuredClone(source),id:0,name:'Custom settings',running:false};
 persistDemo();render();toast('Module settings copied to custom Live settings.');
}
function walletReceive(){
 showLayer('Receive BNB','WALLETS',`<p class="small">Copy a wallet address for an incoming BSC transfer. These addresses are demo values.</p>${state.wallets.map(w=>`<div class="subcard mt"><strong>${e(w.name)}</strong><div class="mono" style="word-break:break-all;font-size:12px;margin:10px 0">${e(w.address)}</div>${button('Copy address','copy-wallet','btn quiet',`data-id="${w.id}"`)}</div>`).join('')}`,button('Close','close','btn primary'));
}
function walletTransfer(){
 showLayer('Send BNB','TRANSFER DRAFT',`<p class="small">Prepare a transfer to a MetaMask or other BSC address. This prototype never signs or sends funds.</p>
 <form id="transfer-form" class="mt"><div class="field"><label>From wallet</label><select class="select" name="source">${state.wallets.map(w=>`<option value="${w.id}">${e(w.name)} · ${fmt(w.balance,3)} BNB</option>`).join('')}</select></div>
 <div class="field mt"><label>Destination address · BSC</label><input class="input" name="destination" placeholder="0x…" autocomplete="off" spellcheck="false" required value="${e(state.transferDraft?.destination||'')}"></div>
 <div class="field mt"><label>Amount · BNB</label><input class="input" name="amount" type="number" min="0.00000001" step="any" inputmode="decimal" placeholder="0.10" value="${e(state.transferDraft?.amount||'')}"></div></form>`,`${button('Cancel','close','btn quiet')}${button('Review draft','wallet-transfer-review','btn primary')}`);
}
function walletTransferReview(){
 const form=document.getElementById('transfer-form');if(!form)return;
 const f=new FormData(form),source=String(f.get('source')),wallet=state.wallets.find(w=>w.id===source);
 const address=String(f.get('destination')||'').trim(),amount=Number(f.get('amount'));
 if(!wallet||!/^0x[a-fA-F0-9]{40}$/.test(address)||!Number.isFinite(amount)||amount<=0||amount>wallet.balance){toast('Check destination address, amount and wallet balance.');return;}
 state.transferDraft={source,destination:address,amount:String(amount)};
 showLayer('Review transfer','DRAFT ONLY',`${line('From',wallet.name)}${line('To',address)}${line('Amount',fmt(amount,8)+' BNB')}<p class="small mt">No blockchain transfer is available in this HTML prototype.</p>`,`${button('Back','wallet-send','btn quiet')}${button('Save draft','wallet-transfer-draft','btn primary')}`);
}
function walletSweep(){
 const r=state.sweepRule;
 showLayer('Automatic transfer','DRAFT RULE',`<p class="small">Configure a threshold and reserve for a future native wallet sweep. No automated transfer runs in this prototype.</p>
 <form id="sweep-form" class="mt"><label class="check-label"><input type="checkbox" name="enabled" ${r.enabled?'checked':''}> Enable rule</label>
 <div class="field mt"><label>Source wallet</label><select class="select" name="source">${state.wallets.map(w=>`<option value="${w.id}" ${r.source===w.id?'selected':''}>${e(w.name)}</option>`).join('')}</select></div>
 <div class="field mt"><label>Destination BSC address</label><input class="input" name="destination" placeholder="0x…" autocomplete="off" spellcheck="false" value="${e(r.destination)}"></div>
 <div class="field-row mt"><div class="field"><label>Trigger balance · BNB</label><input class="input" name="threshold" inputmode="decimal" value="${e(r.threshold)}"></div><div class="field"><label>Keep in wallet · BNB</label><input class="input" name="retain" inputmode="decimal" value="${e(r.retain)}"></div></div></form>`,`${button('Cancel','close','btn quiet')}${button('Save draft rule','wallet-sweep-save','btn primary')}`);
}
function saveWalletSweep(){
 const form=document.getElementById('sweep-form');if(!form)return;
 const f=new FormData(form),enabled=f.get('enabled')==='on',source=String(f.get('source')),
 destination=String(f.get('destination')||'').trim(),threshold=Number(f.get('threshold')),retain=Number(f.get('retain'));
 if(!state.wallets.some(w=>w.id===source)||!Number.isFinite(threshold)||threshold<=0||!Number.isFinite(retain)||retain<0||retain>=threshold||enabled&&!/^0x[a-fA-F0-9]{40}$/.test(destination)){toast('Enter a valid destination, threshold and reserve.');return;}
 state.sweepRule={enabled,source,destination,threshold:String(threshold),retain:String(retain)};
 persistDemo();closeLayer();render();toast('Auto-transfer rule saved as draft. Nothing was sent.');
}
function signals(){healthDetails();}
function settings(){showLayer('Data connections','SETTINGS',`<p class="small">This prototype uses sample data. The production frontend reads authorized Protobuf status topics from the gateway.</p><div class="subcard mt">${[['System','BscStatus'],['Launches','BscLaunchState'],['Monitoring','BscMonitoringState'],['Wallets','BscWalletsState'],['Live','BscLiveState']].map(([n,t])=>line(n,t)).join('')}</div><p class="tiny mt">Historical trade pagination and wallet transfer commands are not yet connected.</p>`,button('Close','close','btn primary'));}

function refreshHistory(){const mount=document.getElementById('history-table');if(mount)mount.innerHTML=historyTable();}

document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id;
 if(a==='nav')navigate(target.dataset.view);
 else if(a==='open-module'){state.trainingModule=Number(id);closeLayer();render();window.scrollTo({top:0,behavior:'instant'});}
 else if(a==='back-training'){state.trainingModule=null;render();}
 else if(a==='open-training-module'){state.view='training';state.trainingModule=Number(id);closeLayer();render();window.scrollTo({top:0,behavior:'instant'});}
 else if(a==='training-tab'){state.trainingTab=target.dataset.tab;render();}
 else if(a==='live-tab'){state.liveSection=target.dataset.tab==='history'?'history':'performance';render();}
 else if(a==='to-history'){state.liveSection='history';render();}
 else if(a==='period'){state[target.dataset.key]=target.dataset.period;render();}
 else if(a==='wallet-chart'){state.walletChart=target.dataset.chart;render();}
 else if(a==='module-details')moduleDetails(id);
 else if(a==='new-module')editModule(null);
 else if(a==='edit-module')editModule(id);
 else if(a==='save-module')saveModule();
 else if(a==='module-toggle')runModule(id);
 else if(a==='run-module')runModule(id);
 else if(a==='copy-module'){const m=state.modules.find(m=>m.id===Number(id));if(m){state.modules.push({...m,id:state.nextModule++,name:m.name+' (copy)',filters:structuredClone(m.filters||{}),running:false,result:0,orders:0,win:0,evaluated:0,rejected:0,incomplete:0});closeLayer();persistDemo();render();toast('Module duplicated.');}}
 else if(a==='delete-module')confirmDelete(id);
 else if(a==='delete-confirm'){if(state.trainingModule===Number(id))state.trainingModule=null;state.modules=state.modules.filter(m=>m.id!==Number(id));if(state.liveProfile===Number(id))state.liveProfile=state.modules[0]?.id||null;closeLayer();persistDemo();render();toast('Module deleted.');}
 else if(a==='trade-columns'){state.columnDraft=state.tradeColumns.slice();tradeColumnPicker();}
 else if(a==='col-up'||a==='col-down'){let col=id,a=state.columnDraft.indexOf(col);if(a>=0){let b=a+(target.dataset.action==='col-up'?-1:1);if(b>=0&&b<state.columnDraft.length){[state.columnDraft[a],state.columnDraft[b]]=[state.columnDraft[b],state.columnDraft[a]];refreshColumnPicker();}}}
 else if(a==='col-default'){state.columnDraft=TRADE_COL_DEFAULT.slice();refreshColumnPicker();}
 else if(a==='col-apply'){state.tradeColumns=safeColumns(state.columnDraft);if(!state.tradeColumns.includes('token'))state.tradeColumns.unshift('token');saveTradeColumns();closeLayer();refreshHistory();toast('Trade columns saved.');}
 else if(a==='trade-details')tradeDetails(id);
 else if(a==='history-more'){state.historyPage++;refreshHistory();}
 else if(a==='open-unknown'){state.view='live';state.liveSection='history';state.historyFilter='unknown';state.historyPage=1;closeLayer();render();}
 else if(a==='live-toggle')liveConfirm();
 else if(a==='live-confirm'){state.liveRunning=true;state.livePaused=false;closeLayer();render();toast('Demo: Live ON.');}
 else if(a==='live-stop'){state.liveRunning=false;state.livePaused=false;closeLayer();render();toast('Demo: Live OFF.');}
 else if(a==='live-pause'){state.livePaused=!state.livePaused;closeLayer();render();toast(state.livePaused?'Demo: new buys paused.':'Demo: buys resumed.');}
 else if(a==='wallet-select'){state.selectedWallet=id;render();}
  else if(a==='copy-wallet'){const w=state.wallets.find(w=>w.id===id);if(w)copyText(w.address);}
 else if(a==='copy')copyText(target.dataset.value);
 else if(a==='signals')signals();
 else if(a==='health-details')healthDetails();
 else if(a==='live-mode'){if(!state.liveRunning){state.liveMode=target.dataset.mode;render();}}
 else if(a==='live-manual-save')saveLiveManual();
 else if(a==='live-manual-import')importLiveManual();
 else if(a==='wallet-send')walletTransfer();
 else if(a==='wallet-transfer-review')walletTransferReview();
 else if(a==='wallet-transfer-draft'){closeLayer();toast('Transfer draft accepted. No funds were sent.');}
 else if(a==='wallet-receive')walletReceive();
 else if(a==='wallet-sweep')walletSweep();
 else if(a==='wallet-sweep-save')saveWalletSweep();
 else if(a==='monitor-details')monitorDetails();
 else if(a==='source-toggle'){const x=demoSources.find(s=>s.id===id);if(x){x.enabled=!x.enabled;const y=window.scrollY;render();window.scrollTo(0,y);toast('Demo state changed only.');}}
 else if(a==='live-limits')liveLimits();
 else if(a==='save-limits')saveLimits();
 else if(a==='wallet-permission'){const w=state.wallets.find(w=>w.id===id);if(w){w.enabled=!w.enabled;render();toast('Wallet permission changed (demo).');}}
 else if(a==='guide')guide();
 else if(a==='settings')settings();
 else if(a==='export-trades')exportTrades();
 else if(a==='close')closeLayer();
});
document.addEventListener('input',ev=>{if(ev.target.id==='trade-search'){state.historySearch=ev.target.value;state.historyPage=1;refreshHistory();}});
document.addEventListener('change',ev=>{if(ev.target.matches('[data-col-select]')){const id=ev.target.dataset.colSelect;if(id!=='token'){if(ev.target.checked){if(!state.columnDraft.includes(id))state.columnDraft.push(id);}else state.columnDraft=state.columnDraft.filter(x=>x!==id);refreshColumnPicker();}return;}if(ev.target.id==='trade-filter'){state.historyFilter=ev.target.value;state.historyPage=1;refreshHistory();}if(ev.target.id==='live-select'){if(!state.liveRunning){state.liveProfile=Number(ev.target.value);render();}}if(ev.target.id==='move-filter'){state.walletMovement=ev.target.value;render();}if(ev.target.id==='trade-market'){state.historyMarket=ev.target.value;state.historyPage=1;refreshHistory();}if(ev.target.id==='trade-time'){state.historyTime=ev.target.value;state.historyPage=1;refreshHistory();}if(ev.target.id==='monitor-market'){state.monitorMarket=ev.target.value;const box=document.getElementById('live-monitoring');if(box)box.innerHTML=monitorPanel();}if(ev.target.matches('[data-run-selector]'))updateRunInputs();if(ev.target.matches('[data-filter-check]')){const key=ev.target.dataset.filterCheck;for(const part of ['min','max']){const field=ev.target.form?.elements.namedItem(`filter-${part}-${key}`);if(field)field.disabled=!ev.target.checked;}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeLayer();if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-open]')){ev.preventDefault();tradeDetails(ev.target.dataset.id);}});
render();updateRunInputs();
</script>
