name: bsc
# The BSC engine regression with all features, including the seven bsc/tools
# tests (cargo test bsc_tools), on macOS (the host: account home, boot
# session, switch owner) and Linux (the cross-platform components).
# Standard GitHub-hosted runners of a public repository: no extra cost.
on:
  push:
    branches: [main]
    paths:
      - 'bsc/**'
      - 'protocol/**'
      - 'frontend/contracts/bsc-*.json'
      - 'frontend/src/features/bsc/**'
      - 'frontend/src/core/**'
      - 'frontend/tests/bsc.spec.ts'
      - 'frontend/playwright.bsc.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'ops/bsc-control.sh'
      - '.github/workflows/bsc.yml'
  workflow_dispatch:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Explicit bash: -e and pipefail (a pipe never hides cargo's exit code).
        shell: bash
        working-directory: bsc/engine
    steps:
      - uses: actions/checkout@v4
      # The workspace's rust-version (bsc/engine/Cargo.toml).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bsc/engine
      - name: npm dependencies of the DRY tools (package-lock)
        working-directory: bsc/tools
        run: |
          npm ci --prefix abi-tools
          npm ci --prefix evm-audit-tools
      - name: cargo regression, all features (bsc_tools runs the seven tool tests)
        run: cargo test --locked --no-fail-fast --workspace --all-features
      # BSC3-054: the canonical -> Strategy C -> executor -> sink -> journal
      # test holds its 1 ms transport start limit in an optimized build only
      # (ignored in the debug run above): it runs here, exactly it, and must pass.
      - name: the release-only journal end-to-end test ran and passed
        run: |
          cargo test --locked --release --all-features -p darkbot-bsc-execution --lib \
            runtime::exec::tests::a_runtime_pass_reaches_the_sink_and_the_journal \
            -- --include-ignored --exact 2>&1 | tee ../release_e2e.txt
          grep -F "test result: ok. 1 passed; 0 failed" ../release_e2e.txt \
            || { echo "::error::the release journal end-to-end test did not run and pass"; exit 1; }
      # BSC3-076: on the real clock a launch's LIVE BUY (its owner lease taken
      # before the launch) and Strategy C's BUY (its admission first) start
      # their transport within the 1 ms limit (optimized build only).
      - name: the release-only LIVE start-limit tests ran and passed
        run: |
          cargo test --locked --release --all-features -p darkbot-bsc-execution --lib \
            -- --include-ignored --exact \
            runtime::live::tests::a_live_buy_starts_within_its_deadline_on_the_real_clock \
            runtime::live::tests::a_strategy_buy_starts_within_its_deadline_after_its_admission \
            2>&1 | tee ../release_live.txt
          grep -F "test result: ok. 2 passed; 0 failed" ../release_live.txt \
            || { echo "::error::the release LIVE start-limit tests did not run and pass"; exit 1; }
      - name: the seven tool tests ran, each with its fixed count
        run: |
          cargo test --locked --all-features -p darkbot-bsc-execution --test bsc_tools -- --nocapture 2>&1 | tee ../tools.txt
          cargo test --locked --all-features -p darkbot-bsc-qualification --test bsc_tools -- --nocapture 2>&1 | tee -a ../tools.txt
          for expected in test_g06a_dry_modes.py:18 test_g06a_shell_scope.py:7 test_g06a_key_hygiene.cjs:3 \
                          test_g06a_private_mode.cjs:4 test_g06a_state_pin.cjs:9 test_readiness_job.py:5 test_status_sync.py:5; do
            f=${expected%%:*}; n=${expected##*:}
            grep -F "bsc_tools $f: exit Some(0), tests $n, pass $n, fail 0, error 0, skip 0" ../tools.txt \
              || { echo "::error::$f did not run with its $n tests all passing"; exit 1; }
          done
  # Audit E 2.7: the BSC page in a production build (frontend/tests/bsc.spec.ts: six tabs, the one
  # LIVE source, fail-closed controls), as the Project 0 page runs in project0-status.yml.
  frontend:
    # Pinned like project0-status.yml: Playwright 1.56 installs no Chromium on ubuntu 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: npm run test:bsc (a failure's error lines become an annotation; the run log is not public)
        run: |
          code=0
          npm run test:bsc 2>&1 | tee "$RUNNER_TEMP/bsc-spec.txt" || code=$?
          if [ "$code" -ne 0 ]; then
            set +o pipefail
            msg=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bsc-spec.txt" | grep -E 'Error|Expected|Received|Locator|Timeout|✘|bsc.spec.ts:' | head -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=bsc.spec.ts::$msg"
          fi
          exit "$code"
