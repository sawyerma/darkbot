name: Gate0 BSC P2P ingress check

on:
  pull_request:
    paths:
      - "gates/bsc/gate0/p2p_ingress/**"
      - ".github/workflows/gate0-p2p-ingress.yml"
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check P2P ingress
        run: cargo check --manifest-path gates/bsc/gate0/p2p_ingress/Cargo.toml
