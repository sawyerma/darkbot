name: Project 0 status contract
on:
  pull_request:
    paths: ['protocol/**', 'frontend/**', 'gateway/**', 'project_0/native/**', 'project_0/scripts/**', 'project_0/tests/**', '.github/workflows/project0-status.yml']
  push:
    branches: [main]
    paths: ['protocol/**', 'frontend/**', 'gateway/**', 'project_0/native/**', 'project_0/scripts/**', 'project_0/tests/**', '.github/workflows/project0-status.yml']
  workflow_dispatch:
jobs:
  contract-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - run: protocol/scripts/check.sh --check
        env:
          PROTOCOL_BASE_REF: origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm run lint:boundaries && npm run check:freeze && npm run lint:css
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:project0 && npm run test:code-split
        working-directory: frontend
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            project_0/native
            gateway
      - run: cargo test -p darkbot-runner --features crate_health --lib market && cargo test -p darkbot-runner --features crate_health --lib status_tap && cargo test -p darkbot-p0-reporter
        working-directory: project_0/native
      - run: cargo build -p darkbot-p0-reporter --features test-fixture --bin p0-reporter-fixture
        working-directory: project_0/native
      - run: cargo test && DARKBOT_P0_REPORTER_FIXTURE="$GITHUB_WORKSPACE/project_0/native/target/debug/p0-reporter-fixture" cargo test --test p0_reporter_e2e -- --ignored
        working-directory: gateway
  # A23-02: the binding Project_0 offline gate (project_0/scripts/gate.sh), split into parallel
  # jobs by step; every step runs exactly as locally (--locked, -D warnings, pinned toolchain).
  project0-gate:
    name: project0-gate (${{ matrix.steps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        steps:
          - fmt clippy_all clippy_default clippy_runner_default clippy_runner_txv1
          - test_all
          - test_default
          - test_runner_default test_runner_txv1
          - release bash_n python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project_0/native
          key: ${{ matrix.steps }}
      - name: gate.sh
        env:
          P6_GATE_STEPS: ${{ matrix.steps }}
        run: |
          logs="$RUNNER_TEMP/p6-gate"
          bash project_0/scripts/gate.sh "$logs" | tee "$RUNNER_TEMP/gate.out"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            for f in "$logs"/*.log; do echo "== $f"; tail -n 120 "$f"; done
            # One annotation per failed step with its error lines (annotations are public).
            for name in $(grep -E ' exit=[1-9]' "$RUNNER_TEMP/gate.out" | awk '{print $1}'); do
              f="$logs/$name.log"
              msg=$( (grep -E '^(error|warning)|FAILED|panicked|^(FAIL|ERROR):|Error|^Diff in|^-->|  --> ' "$f" || tail -n 25 "$f") | head -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=gate $name::$msg"
            done
            exit "$code"
          fi
