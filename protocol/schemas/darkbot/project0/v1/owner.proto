syntax = "proto3";

package darkbot.project0.v1;

// Live state of the Shadow/econ4h state owner: STATE topic project0.liquidator.state
// (orchestration/state_owner, status_tap::OwnerSnapshot). Sent at most every owner_status_ms.
// Values are what the owner holds; an unknown value stays unset, never 0.
message LiquidatorState {
  // Run identity of the owner.
  OwnerRun run = 1;
  // Canonical state, ingress and recovery (solana/src/state, ingress session).
  OwnerEngine engine = 2;
  // Candidate trigger and its lanes (state_owner/candidates.rs).
  OwnerTrigger trigger = 3;
  // Pipeline evaluations and decisions of this run (analytics/shadow_ledger.rs, MT0).
  OwnerPipeline pipeline = 4;
  // Safety layer: limits, capital in use, halts (liquidation/src/safety.rs).
  OwnerSafety safety = 5;
  // Every switchable capability: requested, effective and why it is blocked.
  repeated Capability capabilities = 6;
  // B01: the rebalancing observation of the inventory bands; unset while OFF.
  RebalancePlan rebalance = 7;
  // S1-02: every controlled data source of the owner with its applied control.
  repeated DataSource sources = 8;
  // The owner's last source-control decision; unset before the first one.
  SourceDecision last_source_decision = 9;
  // Source counters of this run.
  SourceStats source_stats = 10;
  // CTRL-03: the source configuration version the owner has decided up to — the
  // ExpectedVersion.config_version a source change states; unset without source control.
  optional uint64 source_config_version = 11;
  // DEC-10: the configured FE-04 approval, secret-free; it never authorizes LIVE (FE-06).
  Fe04Approval approval = 12;
  // DEC-13: the capability configuration version the owner has decided up to — the
  // ExpectedVersion.config_version a capability change states; unset without capability control.
  optional uint64 capability_config_version = 13;
  // DEC-13: the owner's last capability-control decision; unset before the first one.
  SourceDecision last_capability_decision = 14;
  // DEC-13b/DEC-02: the owner's FE-04 admission of LIVE candidates and exits.
  Fe04Admission admission = 15;
  // P8-CTRL.6: this owner start's capability epoch — the epoch a capability change states
  // (CapabilityControlCommand.owner_epoch); unset without capability control.
  optional uint64 capability_epoch = 16;
  // P8-CTRL.3/.5: the FE-06 grant, its scope's limits and use, and the previewed scopes.
  Fe06State fe06 = 17;
}

// P8-CTRL.3/.5: the owner's FE-06 state. A grant is a permission, never a command; its
// operator authentication is a separate gate (block_reason while no grant can be taken).
message Fe06State {
  // The digest of the grant in force; unset without one.
  optional string grant_digest = 1;
  // ALL | EXIT_ONLY | SIM_ONLY of the grant in force; empty without one.
  string scope_mode = 2;
  // The first second of the grant's validity; unset without a grant.
  optional uint64 valid_from_unix_s = 3;
  // The first second after the grant's validity; unset without a grant.
  optional uint64 valid_until_unix_s = 4;
  // In force now (its validity holds and the owner's clock is readable).
  bool in_force = 5;
  // The grant's campaign.
  string campaign_id = 6;
  // The scope's new attempts per UTC day.
  uint64 max_attempts_per_utc_day = 7;
  // The scope's new attempts per campaign.
  uint64 max_attempts_campaign = 8;
  // The scope's new attempts per grant.
  uint64 max_attempts_grant = 9;
  // Attempts booked this UTC day; unset while the FE-04 journals are unreadable (never 0).
  optional uint64 attempts_today = 10;
  // Attempts booked against the campaign; unset while the journals are unreadable.
  optional uint64 attempts_campaign = 11;
  // Attempts booked against the grant; unset while the journals are unreadable.
  optional uint64 attempts_grant = 12;
  // Why no grant is in force or can be taken (the first gate), else empty.
  string block_reason = 13;
  // The scopes previewed for this owner epoch (`p0ctl live scope`), each grantable by its digest.
  repeated Fe06Preview previews = 14;
  // P8-CTRL.5: the scope's exits per grant (0 without a grant).
  uint64 max_exits_grant = 15;
  // Exits booked against the grant; unset while the journals are unreadable (never 0).
  optional uint64 exits_grant = 16;
}

// One previewed FE-06 scope: its digest and exactly what a grant of it permits.
message Fe06Preview {
  // SHA-256 of the scope's canonical bytes (64 hex digits).
  string digest = 1;
  // ALL | EXIT_ONLY | SIM_ONLY.
  string scope_mode = 2;
  // The owner epoch the scope binds.
  uint64 owner_epoch = 3;
  // The first second after the scope's validity.
  uint64 valid_until_unix_s = 4;
  // The native full view the operator confirms (`p0ctl live scope`).
  string terminal = 5;
}

// DEC-13b/DEC-02: the owner's FE-04 admission of LIVE candidates and exits in this run
// (state_owner/fe04.rs). It never opens LIVE itself: that needs the separate FE-06 authorization.
message Fe04Admission {
  // OFF (LIVE not effective) | WAITING (no LIVE candidate yet) | READY | BLOCKED.
  string state = 1;
  // Why no admission is open (OFF: the LIVE block reason); empty when READY.
  string block_reason = 2;
  // Attempts handed off and submitted in this run.
  uint64 submitted = 3;
  // Attempts refused before anything durable.
  uint64 refused = 4;
  // Attempts whose handoff is UNKNOWN (every hold kept, Safety halted).
  uint64 unknown = 5;
  // The last refusal reason, else empty.
  string last_refusal = 6;
  // DEC-02: pipeline simulations reused at the handoff.
  uint64 simulation_reused = 7;
  // DEC-02: payloads simulated again at the handoff.
  uint64 simulation_resimulated = 8;
  // DEC-02: handoffs refused without a reusable simulation and without time for a new one.
  uint64 simulation_refused = 9;
  // DEC-02: why the last reuse was refused, else empty.
  string last_reuse_refusal = 10;
  // Exits of the open inventory handed off in this run.
  uint64 exits_submitted = 11;
  // Exits refused before anything durable.
  uint64 exits_refused = 12;
  // Exits whose handoff is UNKNOWN.
  uint64 exits_unknown = 13;
  // The last exit refusal or UNKNOWN reason, else empty.
  string last_exit_refusal = 14;
}

// One controlled data source (the owner's arbiter: at most one canonical unit).
message DataSource {
  // wss, geyser:<provider>, …
  string unit = 1;
  // AUTHORITATIVE or PRE_EXECUTION_SENSOR.
  string role = 2;
  // The applied mode: off | observe | active.
  string mode = 3;
  // NOT_RUN | LOCAL_PASS | QUALIFIED:<evidence> | BLOCKED:<reason>.
  string qualification = 4;
  // 1 at the start, +1 per applied change.
  uint64 generation = 5;
  // The unit feeds canonical state now.
  bool canonical = 6;
}

// The owner's decision on one source-control request.
message SourceDecision {
  // Request sequence number.
  uint64 seq = 1;
  // `<unit> <mode>` (source) or `<capability> <requested>` (DEC-13 capability) as requested.
  string request = 2;
  // Applied, or refused (see detail).
  bool applied = 3;
  // The refusal reason, or the canonical handoff of an applied control.
  string detail = 4;
}

// Source counters of the owner.
message SourceStats {
  // Events observed by non-canonical units.
  uint64 observed = 1;
  // Events refused (stale stamp, OFF) or not observable.
  uint64 rejected = 2;
  // Control changes applied.
  uint64 applied = 3;
  // Control changes refused.
  uint64 refused = 4;
}

// Parameters (CommandRequest.params) of project0.source.set: the operands of
// `p0ctl source set UNIT MODE`; the running owner applies or refuses the request in order.
message SourceControlCommand {
  // wss or geyser:<provider>.
  string unit = 1;
  // off, observe or active (active needs a qualification record).
  string mode = 2;
}

// DEC-13: parameters (CommandRequest.params) of project0.capability.set: the operands of
// `p0ctl capability set CAPABILITY REQUESTED`; the running owner decides what is effective
// (LIVE stays BLOCKED until a separate FE-06 authorization).
message CapabilityControlCommand {
  // LIVE, HOLD_B, JITO_BUNDLE, THRESHOLD_TRIGGER, ECON_SIGN … ECON_LIVE, WALLET:<pubkey>,
  // FE06_GRANT or FE06_REVOKE.
  string capability = 1;
  // One of the capability's values (a scope digest for FE06_GRANT/FE06_REVOKE).
  string requested = 2;
  // P8-CTRL.6: the owner epoch the view showed (LiquidatorState.capability_epoch).
  uint64 owner_epoch = 3;
}

// B01 (P8-INV-01): the owner's rebalancing plan in OBSERVE — real balances, quotes and conservative
// costs; planned, never traded (ACTIVE needs LIVE).
message RebalancePlan {
  // OFF or OBSERVE.
  string mode = 1;
  // Wall clock of the plan; unset before the first one.
  optional uint64 at_unix_ms = 2;
  // Highest slot of the canonical state the plan read.
  uint64 slot = 3;
  // Planned trades.
  repeated RebalanceTrade trades = 4;
  // Assets not rebalanced, with the stable reason.
  repeated RebalanceBlocked blocked = 5;
  // Quotes asked and not answered yet (the plan is then provisional).
  uint64 quotes_pending = 6;
  // The plan's cost budget.
  uint64 budget_usd_micro = 7;
}

// One planned rebalance trade (ExactIn).
message RebalanceTrade {
  // Inventory key sold (SOL or a mint).
  string sell = 1;
  // Inventory key bought.
  string buy = 2;
  // Amount sold (base units).
  uint64 amount_in = 3;
  // The on-chain enforced minimum output (base units).
  uint64 minimum_out = 4;
  // Conservative cost: value given minus value received plus the planned network fee.
  uint64 cost_usd_micro = 5;
}

// An asset the plan does not rebalance.
message RebalanceBlocked {
  // Inventory key.
  string asset = 1;
  // Stable reason (INVENTORY_BALANCE_UNKNOWN, REBALANCE_COST_UNKNOWN, …).
  string reason = 2;
}

// Run identity of the owner.
message OwnerRun {
  // Run id (p0ctl run id, or "-" for an unnamed local run).
  string run_id = 1;
  // Owner mode: shadow | econ4h.
  string mode = 2;
  // Wall clock of this publication.
  uint64 published_unix_ms = 3;
  // Liquidator wallet, base58 (public key only).
  string wallet = 4;
  // Marginfi program id, base58.
  string program_id = 5;
  // Empty while the owner runs; at its end RUN_COMPLETE or the terminal code.
  string end_result = 6;
}

// Canonical state, ingress and recovery.
message OwnerEngine {
  // BOOTSTRAPPING | RECONCILING | READY | HALTED.
  string run_state = 1;
  // Halt reason while HALTED (e.g. FeedGap), else empty.
  string halt_reason = 2;
  // Current ingress session generation.
  uint64 ingress_generation = 3;
  // Reconnected events applied to the state in this run (A01: counted, never a placeholder).
  uint64 reconnects = 4;
  // A feed gap is open (no new stream generation yet).
  bool gap_open = 5;
  // Newest slot seen by the state.
  uint64 highest_slot = 6;
  // The out-of-band ingress halt is raised.
  bool ingress_halt_raised = 7;
  // A ProgramData change halted the owner.
  bool program_upgrade_latched = 8;
  // State write counters.
  StateCounters counters = 9;
  // The startup ProgramData verdict against the qualified deployment (absent before it is read).
  ProgramPin program_pin = 10;
}

// The ProgramData the owner started on and the qualified deployment it is pinned against
// (liquidation/src/protocol.rs; only REFERENCE may run unhalted, everything else is BLOCKED).
message ProgramPin {
  // REFERENCE | NOT_REFERENCE | UNPINNED.
  string verdict = 1;
  // Hash of the complete ProgramData account at startup.
  string observed_hash = 2;
  // ProgramData deployment slot.
  uint64 deployment_slot = 3;
  // Upgrade authority; absent when the program is immutable.
  optional string upgrade_authority = 4;
  // The protocol source this build decodes.
  string source_tag = 5;
  // The source the qualified reference deployment was qualified for.
  string reference_source_tag = 6;
  // Hash of the qualified reference deployment.
  string reference_hash = 7;
}

// StateCore write counters (solana/src/state::StateCounters).
message StateCounters {
  // Accepted writes.
  uint64 applied = 1;
  // Updates older than the stored slot.
  uint64 stale_slot = 2;
  // Same-slot updates with an older write_version.
  uint64 stale_write_version = 3;
  // Same-slot updates without write_version on both sides (later wins, counted).
  uint64 same_slot_no_wv = 4;
  // F-05: unversioned same-slot updates refused against a versioned record.
  uint64 same_slot_unversioned_refused = 5;
  // Updates below the rooted slot.
  uint64 below_root = 6;
  // Updates buffered before the first snapshot.
  uint64 buffered = 7;
  // Buffered updates not newer than the snapshot.
  uint64 buffer_dropped_le_snapshot = 8;
  // Reconcile: data differs from the snapshot.
  uint64 reconcile_mismatch = 9;
  // Reconcile: in the snapshot, not in the state.
  uint64 reconcile_missing_local = 10;
  // Reconcile: in the state, not in the snapshot.
  uint64 reconcile_missing_remote = 11;
  // Writes removed by fork invalidation.
  uint64 orphaned_writes = 12;
}

// Candidate trigger and its lanes.
message OwnerTrigger {
  // sweep | threshold.
  string mode = 1;
  // Threshold mode: every account's thresholds are known.
  bool threshold_ready = 2;
  // Pending candidates per lane.
  uint64 lane_l0 = 3;
  // Pending L1 candidates.
  uint64 lane_l1 = 4;
  // Pending L2 candidates (re-checks).
  uint64 lane_l2 = 5;
  // Detection work queued behind the lanes.
  uint64 detect_queue = 6;
  // Accounts in the reverse index.
  uint64 indexed_accounts = 7;
  // Repeats suppressed by the forward policy (no new cause).
  uint64 suppressed = 8;
  // Due repeats suppressed by the repeat soft cap.
  uint64 softcap_suppressed = 9;
  // DEC-01: lane candidates refused before planning on a stale or missing blockhash (loss Build,
  // cause BLOCKHASH_STALE) in this run.
  uint64 blockhash_refused = 10;
  // DEC-01: candidates parked now, waiting for a newer blockhash (at most one per account).
  uint64 blockhash_parked = 11;
  // DEC-01: parked candidates returned to their lane after a newer blockhash in this run.
  uint64 blockhash_rearmed = 12;
  // DEC-01: parked candidates covered by a later evaluation of the account in this run.
  uint64 blockhash_superseded = 13;
  // DEC-01: refresh wake-ups sent to the blockhash worker in this run (pending ones coalesced).
  uint64 blockhash_refresh_requests = 14;
  // DEC-06: the threshold mode.
  OwnerThreshold threshold = 15;
}

// DEC-06: the threshold mode — the operator's request, the owner's effective mode and why it
// differs; OBSERVE's comparison with the sweep on the same oracle ticks (hits, misses, extra
// wake-ups, both detection times) and the cost of both paths; ACTIVE's sweep cross-check. Counters
// are the owner run's (a resumed run continues them). ACTIVE is no LIVE.
message OwnerThreshold {
  // OFF | OBSERVE | ACTIVE.
  string requested = 1;
  // config | controller seq N | resume.
  string requested_source = 2;
  // OFF | SWEEP | OBSERVE | ACTIVE.
  string effective = 3;
  // Why effective is not the requested mode (INDEX_BOOTSTRAP, STATE_NOT_TRADABLE, B8_UNDECIDED,
  // THRESHOLD_EVIDENCE_SHORT, THRESHOLD_MISS_FALLBACK, THRESHOLD_BARRIER); empty when it is.
  string block_reason = 4;
  // Bumped by every change of the effective mode or its block reason.
  uint64 generation = 5;
  // N (B-8, threshold_min_ticks); unset while the user has not decided it (ACTIVE blocked).
  optional uint64 min_ticks = 6;
  // Comparable oracle ticks in OBSERVE (same state and input revision as the sweep).
  uint64 ticks = 7;
  // Comparable oracle ticks since the last miss (ACTIVE needs N).
  uint64 streak = 8;
  // Oracle ticks not comparable (sampled, a price ACTIVE projects first, generation change).
  uint64 uncomparable_ticks = 9;
  // Liquidatable accounts found by the sweep and woken by the threshold trigger.
  uint64 hits = 10;
  // Liquidatable accounts the threshold trigger did not wake (OBSERVE and the ACTIVE cross-check).
  uint64 misses = 11;
  // Accounts the threshold trigger woke that the sweep found healthy.
  uint64 extra = 12;
  // OBSERVE work skipped for want of budget (B-9).
  uint64 sampled_out = 13;
  // Times the effective mode left ACTIVE (each with a full sweep of every bank).
  uint64 fallbacks = 14;
  // Index accounts with exact thresholds.
  uint64 index_tracked = 15;
  // Index accounts with unknown thresholds, re-checked bank-wide.
  uint64 index_fallback = 16;
  // Accounts waiting for their thresholds (bootstrap queue).
  uint64 index_bootstrap_pending = 17;
  // Exact threshold evaluations of the index.
  uint64 index_evaluations = 18;
  // ACTIVE cross-check samples evaluated off the owner.
  uint64 crosscheck_samples = 19;
  // ACTIVE cross-check samples skipped (queue full).
  uint64 crosscheck_skipped = 20;
  // ACTIVE cross-check samples whose state or generation changed (or failed).
  uint64 crosscheck_stale = 21;
  // ACTIVE cross-check misses (each an alarm and a fallback).
  uint64 crosscheck_misses = 22;
  // t_rx → exact sweep evaluation of the liquidatable accounts of compared OBSERVE ticks.
  LatencyNs sweep_detect = 23;
  // t_rx → threshold wake-up of the same accounts.
  LatencyNs threshold_detect = 24;
  // Owner time of one unit of threshold work beside the sweep (lookup, comparison, index upkeep,
  // bootstrap batch).
  LatencyNs observe_owner = 25;
  // The total owner time of that work.
  uint64 observe_owner_ns_total = 26;
  // The budget it is held to, in ppm of the owner's wall time (B-9).
  uint64 observe_budget_ppm = 27;
  // The sweep's exact health evaluations.
  uint64 sweep_health_evaluations = 28;
  // The owner time of the sweep's batches.
  uint64 sweep_owner_ns_total = 29;
}

// A latency distribution in ns; percentiles unset without a sample (never 0).
message LatencyNs {
  // Samples.
  uint64 count = 1;
  // Median (conservative bucket bound).
  optional uint64 p50 = 2;
  // 95th percentile.
  optional uint64 p95 = 3;
  // 99th percentile.
  optional uint64 p99 = 4;
  // Largest sample.
  optional uint64 max = 5;
}

// Pipeline evaluations and decisions of the current day (Shadow ledger) and this process (MT0).
message OwnerPipeline {
  // Pipeline evaluations of this process (MT0).
  uint64 evaluations = 1;
  // Exact Health evaluations of the day.
  uint64 health_checked = 2;
  // Accounts found liquidatable on the day.
  uint64 liquidatable = 3;
  // Plans built / rejected on the day.
  uint64 plans_built = 4;
  // Plans rejected on the day.
  uint64 plans_rejected = 5;
  // Simulations passed on the day.
  uint64 simulations_passed = 6;
  // Simulations failed on the day.
  uint64 simulations_failed = 7;
  // Shadow-ready decisions on the day.
  uint64 shadow_ready = 8;
  // Shadow wins against the observed winner on the day.
  uint64 shadow_wins = 9;
  // Loss reasons of the day.
  repeated LossCount losses = 10;
  // p95 of T_rx→T_ready (decision ready: economics and the built plan) of the day; unset without a sample.
  optional uint64 decision_p95_ns = 11;
  // p95 of the fee-quote RPC of this process; unset without a sample.
  optional uint64 fee_quote_p95_ns = 12;
  // p95 of the simulation RPC of this process; unset without a sample.
  optional uint64 simulation_p95_ns = 13;
}

// One loss reason with its count.
message LossCount {
  // Loss reason (record name).
  string reason = 1;
  // Count of the day.
  uint64 count = 2;
}

// Safety layer.
message OwnerSafety {
  // Capital reserved by in-flight attempts, USD micro.
  uint64 capital_in_use_usd_micro = 1;
  // Configured limits.
  uint64 max_total_capital_usd_micro = 2;
  // Configured maximum daily loss, USD micro.
  uint64 max_daily_loss_usd_micro = 3;
  // Configured maximum exposure per attempt, USD micro.
  uint64 max_exposure_per_attempt_usd_micro = 4;
  // Configured maximum concurrent positions.
  uint32 max_concurrent_positions = 5;
  // Configured maximum outstanding attempts.
  uint32 max_outstanding_attempts = 6;
  // Configured maximum failed attempts per day.
  uint32 max_failed_attempts_per_day = 7;
  // Halt reason of the Safety layer, empty when not halted.
  string halt_reason = 8;
  // Booked day: realized PnL (USD micro) and failed / total attempts.
  optional int64 day_realized_usd_micro = 9;
  // Failed attempts of the day.
  uint32 day_failed_attempts = 10;
  // Attempts of the day.
  uint32 day_attempts = 11;
}

// One switchable capability (P0-PROD-CTRL-03).
message Capability {
  // LIVE | SUBMISSION | JITO_BUNDLE | V1_MESSAGES | JIT_EXACT_IN | INVENTORY_REBALANCING | THRESHOLD_TRIGGER.
  string name = 1;
  // What is configured: OFF | OBSERVE | ACTIVE.
  string requested = 2;
  // What runs: OFF | OBSERVE | ACTIVE | BLOCKED | NOT_AUTHORIZED | UNSUPPORTED.
  string effective = 3;
  // Why effective differs from requested (gate, missing qualification), else empty.
  string block_reason = 4;
  // P8-CTRL.1: the validated roles of a WALLET:<pubkey> signer (LIQUIDATOR, FEE_PAYER).
  repeated string roles = 5;
}

// FE-04 wallet state of the liquidator: STATE topic project0.wallets.state. Read from the
// wallet's FE-04 journals (execution/accounting.rs) and the reservation book.
message WalletsState {
  // Same id as the FinanceSummary of this state.
  string finance_snapshot_id = 1;
  // Liquidator wallet, base58.
  string wallet = 2;
  // An FE-04 journal directory is configured and was read.
  bool journal_read = 3;
  // FE-07 verdict: NO_TRADE | FIRST_REALIZED_PROFIT_EVIDENCED | LOSS | UNKNOWN.
  string verdict = 4;
  // Why the verdict is UNKNOWN (unsettled steps, open inventory) or the journal read error.
  repeated string unknown_reasons = 5;
  // Own attempts in the journals (archived and active); unset unless the journal was read.
  optional uint64 attempts = 6;
  // Archived attempts; unset unless the journal was read.
  optional uint64 archived_attempts = 7;
  // Settled attempts that landed; unset unless the journal was read.
  optional uint64 landed_attempts = 8;
  // Settled exits; unset unless the journal was read.
  optional uint64 settled_exits = 9;
  // Fees of the settled steps; unset on overflow.
  optional uint64 fee_lamports = 10;
  // Mark of the open inventory; unset when a position is unvalued.
  optional int64 open_inventory_mark_usd_micro = 11;
  // Holds of every attempt in the reservation book, per asset ("SOL" lamports or mint units).
  repeated AssetAmount holds = 12;
  // Never-spent policy reserves of the inventory bands.
  repeated AssetAmount policy_reserves = 13;
  // State of the attempt held by this run: NONE | RESERVED | UNKNOWN | FINALIZED_UNBOOKED | SETTLED.
  string held_attempt = 14;
  // DEC-03: the non-landing status of the held attempt or its latest exit; unset without a held
  // FE-04 journal.
  NonLanding non_landing = 15;
  // DEC-04: the B hold mode and the held attempt's A, B and finalized flows; unset without an
  // owner projection.
  HoldB hold_b = 16;
}

// DEC-04 (V7): the B hold mode — requested and effective (ACTIVE only with the user's N and the
// journals' evidence) — the evidence, Safety's reserved inventory and capital, and the held
// attempt's holds.
message HoldB {
  // OFF | OBSERVE | ACTIVE.
  string requested = 1;
  // OFF | OBSERVE | ACTIVE.
  string effective = 2;
  // Why the effective mode is not the requested one; empty when it is.
  string block_reason = 3;
  // The user's N (B-8); unset while undecided.
  optional uint64 n = 4;
  // Landed, settled attempts with an exact B and no underestimation.
  uint64 evidence_exact = 5;
  // Landed, settled attempts whose B underestimated a flow.
  uint64 evidence_underestimated = 6;
  // Landed, settled attempts without an exact B.
  uint64 evidence_unqualified = 7;
  // Inventory holds reserved by unsettled attempts, USD micro.
  uint64 inventory_reserved_usd_micro = 8;
  // Capital in use by unsettled attempts, USD micro.
  uint64 capital_in_use_usd_micro = 9;
  // The held attempt's holds; unset without one (or one admitted in OFF).
  HoldAttempt attempt = 10;
}

// DEC-04: one attempt's holds: A (wallet reservation, inventory hold) and B against the
// finalized flows.
message HoldAttempt {
  // The mode it was admitted in: OFF | OBSERVE | ACTIVE.
  string mode = 1;
  // A's wallet reservation per asset ("SOL" lamports or mint units).
  repeated AssetAmount a_wallet = 2;
  // A's inventory hold: the conservative value of the whole seizure, USD micro.
  uint64 a_inventory_usd_micro = 3;
  // EXACT | UNQUALIFIED.
  string b_class = 4;
  // Why B is unqualified (A applies); empty when exact.
  string b_reason = 5;
  // PLAIN | KAMINO | DRIFT | JUPLEND; empty when unqualified.
  string b_kind = 6;
  // B's inventory hold, USD micro; unset when unqualified.
  optional uint64 b_inventory_usd_micro = 7;
  // B per asset against the finalized delta: every asset of B or of the deltas.
  repeated HoldFlow flows = 8;
  // The inventory hold Safety reserved for the attempt, USD micro (A's unless an effective ACTIVE
  // qualified B).
  uint64 reserved_inventory_usd_micro = 9;
  // A per asset against the finalized delta: every asset of A's wallet reservation or of the
  // deltas (A keeps nothing in the wallet; it holds the seizure in the inventory limit).
  repeated HoldFlow a_flows = 10;
  // The attempt is settled: the finalized deltas and inventory mark are its own.
  bool settled = 11;
  // The finalized open-inventory mark, USD micro; unset until settled (or beyond int64).
  optional sint64 actual_inventory_usd_micro = 12;
}

// DEC-04: one asset of B: what the wallet holds before the attempt and keeps at most after it,
// the finalized delta and whether B underestimated it.
message HoldFlow {
  // "SOL" or the mint, base58.
  string asset = 1;
  // Base units held before the attempt.
  uint64 reserve = 2;
  // Base units kept at most after it.
  uint64 residual_max = 3;
  // The finalized wallet delta; unset until settled (or beyond int64).
  optional sint64 actual = 4;
  // The delta is a debit beyond the reserve or an inflow beyond the residual.
  bool underestimated = 5;
  // No bound in units (a swap's output; its value is bounded in B's inventory hold);
  // residual_max is then 0.
  bool residual_unbounded = 6;
}

// DEC-03 (N-2): the non-landing status of one FE-04 subject — exactly one result class, the
// latest read's B sources and C result, the hold duration and the read's calls and bytes. No
// switch and no manual resolution.
message NonLanding {
  // ATTEMPT | EXIT.
  string subject = 1;
  // B_C_CONFIRMED | C_ALONE_QUALIFIED | VETO_LANDING_CONFIRMED | VETO_CONTRADICTION_OPEN |
  // UNKNOWN_INCOMPLETE; NONE before the handoff or for a release before N-2.
  string result_class = 2;
  // An open contradiction (a sighting without a confirmed landing): holds stay, read again.
  bool alarm = 3;
  // The latest read's B sources.
  repeated NonLandingSource sources = 4;
  // The latest read's C result: NEGATIVE | SIGHTING | C_<reason>; empty without a read.
  string c_result = 5;
  // How long the hold has been held, milliseconds; unset without a hold.
  optional uint64 hold_ms = 6;
  // Calls of the latest read; unset without a read in this run.
  optional uint64 calls = 7;
  // Request and response bytes of the latest read; unset without a read in this run.
  optional uint64 bytes = 8;
  // Reads of this subject in this run.
  uint64 reads = 9;
}

// One B source of a non-landing read.
message NonLandingSource {
  // Operator label of the source.
  string operator = 1;
  // USABLE | UNUSABLE_<reason> | SIGHTING.
  string class = 2;
}

// DEC-10: secret-free status of the FE-04 approval file (native key = value) the runtime is
// configured with, bound to its wallet, program, observed ProgramData, clean HEAD, binaries and
// Safety ceilings, single use checked against its FE-04 journals.
message Fe04Approval {
  // NONE | VALID | EXPIRED | CONSUMED | BLOCKED | INVALID | BINDING_MISMATCH.
  string state = 1;
  // Refusal code or the mismatching bindings; empty when VALID or NONE.
  string reason = 2;
  // attempt | exit; empty without an approval.
  string kind = 3;
  // Approval id (spent once).
  string approval_id = 4;
  // Funding class of an attempt approval.
  string funding_class = 5;
  // Expiry, Unix seconds.
  uint64 expires_unix_s = 6;
  // Attempt approval: capital bound, USD-micro.
  uint64 max_capital_usd_micro = 7;
  // Attempt approval: loss bound, USD-micro.
  uint64 max_loss_usd_micro = 8;
  // Attempt approval: minimum conservative net, USD-micro.
  uint64 min_net_usd_micro = 9;
  // Slippage bound (both kinds).
  uint64 max_slippage_bps = 10;
  // Number of allowed targets of an attempt approval.
  uint64 allowed_targets = 11;
}

// One amount of one asset.
message AssetAmount {
  // "SOL" or the mint, base58.
  string asset = 1;
  // Amount in base units (lamports for SOL).
  uint64 units = 2;
}

// Finance summary of the liquidator: STATE topic project0.finance.summary (same
// finance_snapshot_id as project0.wallets.state). Unknown values stay unset.
message FinanceSummary {
  // Same id as the WalletsState of this state.
  string finance_snapshot_id = 1;
  // Newest slot of the state the summary was taken at.
  uint64 as_of_slot = 2;
  // Needs reconciled wallet balances; unset until they exist.
  optional int64 total_capital_usd_micro = 3;
  // Needs reconciled wallet balances; unset until they exist.
  optional int64 available_capital_usd_micro = 4;
  // Capital reserved by in-flight attempts.
  optional int64 reserved_capital_usd_micro = 5;
  // Realized net of the settled steps (FE-04 accounting).
  optional int64 realized_net_pnl_usd_micro = 6;
  // Withdrawable realized profit; unset unless every input is known.
  optional int64 withdrawable_profit_usd_micro = 7;
  // No transfer path exists: 0 once the journal was read.
  optional int64 transferred_to_treasury_usd_micro = 8;
  // VERIFIED (every field known) | PARTIAL (journal read, a field unknown) | UNKNOWN (no journal read).
  string status = 9;
}
