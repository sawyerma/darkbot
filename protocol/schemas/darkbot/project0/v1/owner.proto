syntax = "proto3";

package darkbot.project0.v1;

// Live state of the Shadow/econ4h state owner: STATE topic project0.liquidator.state
// (orchestration/state_owner, status_tap::OwnerSnapshot). Sent at most every owner_status_ms.
// Values are what the owner holds; an unknown value stays unset, never 0.
message LiquidatorState {
  // Run identity of the owner.
  OwnerRun run = 1;
  // Canonical state, ingress and recovery (solana/src/state, ingress session).
  OwnerEngine engine = 2;
  // Candidate trigger and its lanes (state_owner/candidates.rs).
  OwnerTrigger trigger = 3;
  // Pipeline evaluations and decisions of this run (analytics/shadow_ledger.rs, MT0).
  OwnerPipeline pipeline = 4;
  // Safety layer: limits, capital in use, halts (liquidation/src/safety.rs).
  OwnerSafety safety = 5;
  // Every switchable capability: requested, effective and why it is blocked.
  repeated Capability capabilities = 6;
  // B01: the rebalancing observation of the inventory bands; unset while OFF.
  RebalancePlan rebalance = 7;
}

// B01 (P8-INV-01): the owner's rebalancing plan in OBSERVE — real balances, quotes and conservative
// costs; planned, never traded (ACTIVE needs LIVE).
message RebalancePlan {
  // OFF or OBSERVE.
  string mode = 1;
  // Wall clock of the plan; unset before the first one.
  optional uint64 at_unix_ms = 2;
  // Highest slot of the canonical state the plan read.
  uint64 slot = 3;
  // Planned trades.
  repeated RebalanceTrade trades = 4;
  // Assets not rebalanced, with the stable reason.
  repeated RebalanceBlocked blocked = 5;
  // Quotes asked and not answered yet (the plan is then provisional).
  uint64 quotes_pending = 6;
  // The plan's cost budget.
  uint64 budget_usd_micro = 7;
}

// One planned rebalance trade (ExactIn).
message RebalanceTrade {
  // Inventory key sold (SOL or a mint).
  string sell = 1;
  // Inventory key bought.
  string buy = 2;
  // Amount sold (base units).
  uint64 amount_in = 3;
  // The on-chain enforced minimum output (base units).
  uint64 minimum_out = 4;
  // Conservative cost: value given minus value received plus the planned network fee.
  uint64 cost_usd_micro = 5;
}

// An asset the plan does not rebalance.
message RebalanceBlocked {
  // Inventory key.
  string asset = 1;
  // Stable reason (INVENTORY_BALANCE_UNKNOWN, REBALANCE_COST_UNKNOWN, …).
  string reason = 2;
}

// Run identity of the owner.
message OwnerRun {
  // Run id (p0ctl run id, or "-" for an unnamed local run).
  string run_id = 1;
  // Owner mode: shadow | econ4h.
  string mode = 2;
  // Wall clock of this publication.
  uint64 published_unix_ms = 3;
  // Liquidator wallet, base58 (public key only).
  string wallet = 4;
  // Marginfi program id, base58.
  string program_id = 5;
  // Empty while the owner runs; at its end RUN_COMPLETE or the terminal code.
  string end_result = 6;
}

// Canonical state, ingress and recovery.
message OwnerEngine {
  // BOOTSTRAPPING | RECONCILING | READY | HALTED.
  string run_state = 1;
  // Halt reason while HALTED (e.g. FeedGap), else empty.
  string halt_reason = 2;
  // Current ingress session generation.
  uint64 ingress_generation = 3;
  // Reconnected events applied to the state in this run (A01: counted, never a placeholder).
  uint64 reconnects = 4;
  // A feed gap is open (no new stream generation yet).
  bool gap_open = 5;
  // Newest slot seen by the state.
  uint64 highest_slot = 6;
  // The out-of-band ingress halt is raised.
  bool ingress_halt_raised = 7;
  // A ProgramData change halted the owner.
  bool program_upgrade_latched = 8;
  // State write counters.
  StateCounters counters = 9;
}

// StateCore write counters (solana/src/state::StateCounters).
message StateCounters {
  // Accepted writes.
  uint64 applied = 1;
  // Updates older than the stored slot.
  uint64 stale_slot = 2;
  // Same-slot updates with an older write_version.
  uint64 stale_write_version = 3;
  // Same-slot updates without write_version on both sides (later wins, counted).
  uint64 same_slot_no_wv = 4;
  // F-05: unversioned same-slot updates refused against a versioned record.
  uint64 same_slot_unversioned_refused = 5;
  // Updates below the rooted slot.
  uint64 below_root = 6;
  // Updates buffered before the first snapshot.
  uint64 buffered = 7;
  // Buffered updates not newer than the snapshot.
  uint64 buffer_dropped_le_snapshot = 8;
  // Reconcile: data differs from the snapshot.
  uint64 reconcile_mismatch = 9;
  // Reconcile: in the snapshot, not in the state.
  uint64 reconcile_missing_local = 10;
  // Reconcile: in the state, not in the snapshot.
  uint64 reconcile_missing_remote = 11;
  // Writes removed by fork invalidation.
  uint64 orphaned_writes = 12;
}

// Candidate trigger and its lanes.
message OwnerTrigger {
  // sweep | threshold.
  string mode = 1;
  // Threshold mode: every account's thresholds are known.
  bool threshold_ready = 2;
  // Pending candidates per lane.
  uint64 lane_l0 = 3;
  // Pending L1 candidates.
  uint64 lane_l1 = 4;
  // Pending L2 candidates (re-checks).
  uint64 lane_l2 = 5;
  // Detection work queued behind the lanes.
  uint64 detect_queue = 6;
  // Accounts in the reverse index.
  uint64 indexed_accounts = 7;
  // Repeats suppressed by the forward policy (no new cause).
  uint64 suppressed = 8;
  // Due repeats suppressed by the repeat soft cap.
  uint64 softcap_suppressed = 9;
}

// Pipeline evaluations and decisions of the current day (Shadow ledger) and this process (MT0).
message OwnerPipeline {
  // Pipeline evaluations of this process (MT0).
  uint64 evaluations = 1;
  // Exact Health evaluations of the day.
  uint64 health_checked = 2;
  // Accounts found liquidatable on the day.
  uint64 liquidatable = 3;
  // Plans built / rejected on the day.
  uint64 plans_built = 4;
  // Plans rejected on the day.
  uint64 plans_rejected = 5;
  // Simulations passed on the day.
  uint64 simulations_passed = 6;
  // Simulations failed on the day.
  uint64 simulations_failed = 7;
  // Shadow-ready decisions on the day.
  uint64 shadow_ready = 8;
  // Shadow wins against the observed winner on the day.
  uint64 shadow_wins = 9;
  // Loss reasons of the day.
  repeated LossCount losses = 10;
  // p95 of T_rx→T_ready (decision ready: economics and the built plan) of the day; unset without a sample.
  optional uint64 decision_p95_ns = 11;
  // p95 of the fee-quote RPC of this process; unset without a sample.
  optional uint64 fee_quote_p95_ns = 12;
  // p95 of the simulation RPC of this process; unset without a sample.
  optional uint64 simulation_p95_ns = 13;
}

// One loss reason with its count.
message LossCount {
  // Loss reason (record name).
  string reason = 1;
  // Count of the day.
  uint64 count = 2;
}

// Safety layer.
message OwnerSafety {
  // Capital reserved by in-flight attempts, USD micro.
  uint64 capital_in_use_usd_micro = 1;
  // Configured limits.
  uint64 max_total_capital_usd_micro = 2;
  // Configured maximum daily loss, USD micro.
  uint64 max_daily_loss_usd_micro = 3;
  // Configured maximum exposure per attempt, USD micro.
  uint64 max_exposure_per_attempt_usd_micro = 4;
  // Configured maximum concurrent positions.
  uint32 max_concurrent_positions = 5;
  // Configured maximum outstanding attempts.
  uint32 max_outstanding_attempts = 6;
  // Configured maximum failed attempts per day.
  uint32 max_failed_attempts_per_day = 7;
  // Halt reason of the Safety layer, empty when not halted.
  string halt_reason = 8;
  // Booked day: realized PnL (USD micro) and failed / total attempts.
  optional int64 day_realized_usd_micro = 9;
  // Failed attempts of the day.
  uint32 day_failed_attempts = 10;
  // Attempts of the day.
  uint32 day_attempts = 11;
}

// One switchable capability (P0-PROD-CTRL-03).
message Capability {
  // LIVE | SUBMISSION | JITO_BUNDLE | V1_MESSAGES | JIT_EXACT_IN | INVENTORY_REBALANCING | THRESHOLD_TRIGGER.
  string name = 1;
  // What is configured: OFF | OBSERVE | ACTIVE.
  string requested = 2;
  // What runs: OFF | OBSERVE | ACTIVE | BLOCKED | NOT_AUTHORIZED | UNSUPPORTED.
  string effective = 3;
  // Why effective differs from requested (gate, missing qualification), else empty.
  string block_reason = 4;
}

// FE-04 wallet state of the liquidator: STATE topic project0.wallets.state. Read from the
// wallet's FE-04 journals (execution/accounting.rs) and the reservation book.
message WalletsState {
  // Same id as the FinanceSummary of this state.
  string finance_snapshot_id = 1;
  // Liquidator wallet, base58.
  string wallet = 2;
  // An FE-04 journal directory is configured and was read.
  bool journal_read = 3;
  // FE-07 verdict: NO_TRADE | FIRST_REALIZED_PROFIT_EVIDENCED | LOSS | UNKNOWN.
  string verdict = 4;
  // Why the verdict is UNKNOWN (unsettled steps, open inventory) or the journal read error.
  repeated string unknown_reasons = 5;
  // Own attempts in the journals (archived and active); unset unless the journal was read.
  optional uint64 attempts = 6;
  // Archived attempts; unset unless the journal was read.
  optional uint64 archived_attempts = 7;
  // Settled attempts that landed; unset unless the journal was read.
  optional uint64 landed_attempts = 8;
  // Settled exits; unset unless the journal was read.
  optional uint64 settled_exits = 9;
  // Fees of the settled steps; unset on overflow.
  optional uint64 fee_lamports = 10;
  // Mark of the open inventory; unset when a position is unvalued.
  optional int64 open_inventory_mark_usd_micro = 11;
  // Holds of every attempt in the reservation book, per asset ("SOL" lamports or mint units).
  repeated AssetAmount holds = 12;
  // Never-spent policy reserves of the inventory bands.
  repeated AssetAmount policy_reserves = 13;
  // State of the attempt held by this run: NONE | RESERVED | UNKNOWN | FINALIZED_UNBOOKED | SETTLED.
  string held_attempt = 14;
}

// One amount of one asset.
message AssetAmount {
  // "SOL" or the mint, base58.
  string asset = 1;
  // Amount in base units (lamports for SOL).
  uint64 units = 2;
}

// Finance summary of the liquidator: STATE topic project0.finance.summary (same
// finance_snapshot_id as project0.wallets.state). Unknown values stay unset.
message FinanceSummary {
  // Same id as the WalletsState of this state.
  string finance_snapshot_id = 1;
  // Newest slot of the state the summary was taken at.
  uint64 as_of_slot = 2;
  // Needs reconciled wallet balances; unset until they exist.
  optional int64 total_capital_usd_micro = 3;
  // Needs reconciled wallet balances; unset until they exist.
  optional int64 available_capital_usd_micro = 4;
  // Capital reserved by in-flight attempts.
  optional int64 reserved_capital_usd_micro = 5;
  // Realized net of the settled steps (FE-04 accounting).
  optional int64 realized_net_pnl_usd_micro = 6;
  // Withdrawable realized profit; unset unless every input is known.
  optional int64 withdrawable_profit_usd_micro = 7;
  // No transfer path exists: 0 once the journal was read.
  optional int64 transferred_to_treasury_usd_micro = 8;
  // VERIFIED (every field known) | PARTIAL (journal read, a field unknown) | UNKNOWN (no journal read).
  string status = 9;
}
