syntax = "proto3";
package darkbot.bsc.v1;

import "darkbot/bsc/v1/common.proto";

// V8 Training and Strategy C settings (BSC-V8-01…06, FE-V8-04…09, Bindings §14.1/§14.2/§14.4
// M1–M3). Answered natively: StrategyCSettingsState (POST /api/v1/bsc/query, the reporter's
// `--query`) and `bsc.strategy.set_all`; every other contract here is prepared (no producer yet).
// Strategy C stays the one BSC strategy; a profile is
// a named, versioned Strategy C configuration, a training run executes it PAPER/SHADOW/REPLAY on
// the one existing core, never with real funds. The ten settable keys exist natively
// (execution/src/strategy_settings.rs KEYS, the first-buyer window BSC_STRATEGY_C_FIRST_BUYER_WINDOW
// included): gateway `bsc.strategy.set` sets one key per request, `bsc.strategy.set_all` several as
// one generation; the 15 filters are trading/src/strategy/features.rs NAMES[0..15] with the parser
// filters.rs. A command carries only these settable values (StrategyCSettableValues); the
// configuration-owned values (ratio places, fill delay, gas price) are read-only and appear in the
// state only. No key has a native "unset": the owner stores the value it gets, an empty value is
// refused for every key but the filters (empty = no rules), and nothing returns a key to the
// configuration file's value but sending that value.
//
// The configuration hash (every *config_sha256 here) is SHA-256, lowercase hex, of the text
// `KEY=value\n` for each settable key in the native KEYS order of strategy_settings.rs
// (OBSERVATION_MS, FILTERS, INPUT_WEI, TARGET_NET_MULTIPLE, STOP_NET_MULTIPLE, HOLD_MS, MAX_OPEN,
// CREATOR_SOLD_BEFORE_FILL, CREATOR_SELL_EXIT, FIRST_BUYER_WINDOW; each with its BSC_STRATEGY_C_
// prefix), value = the effective value (a stored key over the configuration
// file's) as the native canonical string `bsc.strategy.set` takes (the filters as their native
// string). The read-only configuration values are not hashed; the same values give the same hash
// in every owner.
//
// Actions (POST /api/v1/command, CommandRequest.action). Registered: bsc.strategy.set_all, resource_id
// empty. Prepared (NOT registered in the gateway until the native owner implements them, the
// frontend keeps them disabled): every other one.
//   bsc.strategy.set_all          StrategyCSettingsSetAllCommand  expected profile_version = stored revision
//   bsc.training.profile.create   TrainingProfileCreateCommand    expected config_version = catalog_version
//   bsc.training.profile.update   TrainingProfileUpdateCommand    expected profile_version = profile revision, resource_id = profile_id
//   bsc.training.profile.clone    TrainingProfileCloneCommand     expected config_version = catalog_version, resource_id = source_profile_id
//   bsc.training.profile.delete   TrainingProfileDeleteCommand    expected profile_version = profile revision, resource_id = profile_id
//   bsc.training.run.start        TrainingRunStartCommand         expected profile_version = profile revision, resource_id = profile_id
//   bsc.training.run.stop         TrainingRunStopCommand          resource_id = run_id
//   bsc.live.strategy.select      LiveStrategySelectCommand       expected profile_version = the bound revision, resource_id = profile_id
// A profile revision records the request that wrote it (TrainingProfile.request_id). One training
// run at a time: a start while another runs is refused (TRAINING_RUN_ACTIVE), as is a start whose
// mode conflicts with the runtime's BSC_RUNTIME_MODE (RUNTIME_MODE_CONFLICT). A LIVE selection writes
// the revision's settable values as ONE settings generation (its compare-and-swap
// expected_settings_generation); its receipt names profile_id and profile_revision.

// The creator selling before the BUY fills (BSC_STRATEGY_C_CREATOR_SOLD_BEFORE_FILL).
enum CreatorSoldBeforeFill {
  // Not set: in a state the configuration file's value; in a set_all the stored value stays.
  CREATOR_SOLD_BEFORE_FILL_UNSPECIFIED = 0;
  // FREE_CANCEL: the entry is cancelled before execution.
  CREATOR_SOLD_BEFORE_FILL_FREE_CANCEL = 1;
  // TX_LANDS: the BUY transaction may still land; never a guaranteed fill.
  CREATOR_SOLD_BEFORE_FILL_TX_LANDS = 2;
}

// The creator-sell exit (BSC_STRATEGY_C_CREATOR_SELL_EXIT). A team-sell exit is NOT_IMPLEMENTED
// (BSC-V8-06) and has no field until a native wallet attribution and sell signal exist.
enum CreatorSellExit {
  // Not set: in a state the configuration file's value; in a set_all the stored value stays.
  CREATOR_SELL_EXIT_UNSPECIFIED = 0;
  // ENABLED: a sale by the token's creator ends the position.
  CREATOR_SELL_EXIT_ENABLED = 1;
  // DISABLED: a creator sale does not end the position.
  CREATOR_SELL_EXIT_DISABLED = 2;
}

// One entry filter `feature:min:max` of BSC_STRATEGY_C_FILTERS. A disabled rule is not part of the
// serialized native string; an enabled rule without bounds still fails on a NULL feature. Rules keep
// the native rule order of the stored string (the owner's, never re-sorted by a client).
message StrategyFilterRule {
  // The native feature name (features.rs NAMES[0..15]); never provider_gap_flag.
  string feature = 1;
  // Whether the rule is part of the configuration.
  bool enabled = 2;
  // Lower bound, exact decimal at the feature's places; absent: unbounded.
  optional string min = 3;
  // Upper bound, exact decimal at the feature's places; absent: unbounded.
  optional string max = 4;
}

// One filterable native feature as the owner defines it (no frontend list of units or places).
message StrategyFeatureSpec {
  // The native feature name.
  string name = 1;
  // Its position in features.rs NAMES.
  uint32 index = 2;
  // Native unit: count, bnb (decimal BNB at 18 places), ratio, percent, milliseconds or flag
  // (provider_gap_flag, never filterable).
  string unit = 3;
  // Decimal places a bound may have (BNB amounts 18, ratios BSC_STRATEGY_C_RATIO_PLACES).
  uint32 places = 4;
  // Whether a bound may be negative (signed features such as net_buy_flow_bnb, price_change).
  bool signed = 5;
  // False for provider_gap_flag: a data-quality flag, never a filter.
  bool filterable = 6;
}

// A Strategy C configuration as the owner reports it (state only, never a command's params): the
// settable values 1–10 and the configuration-owned, read-only values 11–13. Each value is optional:
// absent means the configuration file's value (the native owner's rule).
message StrategyCSettings {
  // BSC_STRATEGY_C_INPUT_WEI: the BUY input per entry, decimal wei.
  optional string input_wei = 1;
  // BSC_STRATEGY_C_TARGET_NET_MULTIPLE: exit at this net multiple of the input (after every cost),
  // exact decimal at ratio_places, e.g. "1.50".
  optional string target_net_multiple = 2;
  // BSC_STRATEGY_C_STOP_NET_MULTIPLE: exit at this net multiple, exact decimal at ratio_places.
  optional string stop_net_multiple = 3;
  // BSC_STRATEGY_C_OBSERVATION_MS: the observation window before an entry, milliseconds.
  optional uint64 observation_ms = 4;
  // BSC_STRATEGY_C_HOLD_MS: the longest hold before the timeout exit, milliseconds.
  optional uint64 hold_ms = 5;
  // BSC_STRATEGY_C_MAX_OPEN: the most positions open at once, per venue.
  optional uint32 max_open = 6;
  // BSC_STRATEGY_C_CREATOR_SOLD_BEFORE_FILL.
  CreatorSoldBeforeFill creator_sold_before_fill = 7;
  // BSC_STRATEGY_C_CREATOR_SELL_EXIT.
  CreatorSellExit creator_sell_exit = 8;
  // BSC_STRATEGY_C_FILTERS: the rules in the native rule order.
  repeated StrategyFilterRule filters = 9;
  // BSC_STRATEGY_C_FIRST_BUYER_WINDOW: the buyers counted as early, within its StrategySettingSpec.
  optional uint32 first_buyer_window = 10;
  // BSC_STRATEGY_C_RATIO_PLACES: decimal places of ratios and multiples (configuration, read-only).
  optional uint32 ratio_places = 11;
  // BSC_STRATEGY_C_FILL_DELAY_BLOCKS (configuration, read-only).
  optional uint32 fill_delay_blocks = 12;
  // BSC_STRATEGY_C_GAS_PRICE_WEI (configuration, read-only), decimal wei.
  optional string gas_price_wei = 13;
}

// The settable Strategy C values of a command (set_all, profile create/update): the ten native keys.
// A set_all carries the values it changes: an absent value (an enum UNSPECIFIED) stays as stored,
// an empty scalar is refused. Its filters are always the complete form: every shown feature with
// its enabled flag (the disabled rules are dropped natively, the enabled ones stored in the order
// sent); an empty list is refused (InvalidParams), so no rules = every feature with enabled false.
// A profile carries every value (an enum not UNSPECIFIED). The owner refuses a value outside its
// StrategySettingSpec and stores nothing half.
message StrategyCSettableValues {
  // BSC_STRATEGY_C_INPUT_WEI: the BUY input per entry, decimal wei.
  optional string input_wei = 1;
  // BSC_STRATEGY_C_TARGET_NET_MULTIPLE: exact decimal at the ratio places, e.g. "1.50".
  optional string target_net_multiple = 2;
  // BSC_STRATEGY_C_STOP_NET_MULTIPLE: exact decimal at the ratio places.
  optional string stop_net_multiple = 3;
  // BSC_STRATEGY_C_OBSERVATION_MS, milliseconds.
  optional uint64 observation_ms = 4;
  // BSC_STRATEGY_C_HOLD_MS, milliseconds.
  optional uint64 hold_ms = 5;
  // BSC_STRATEGY_C_MAX_OPEN, per venue.
  optional uint32 max_open = 6;
  // BSC_STRATEGY_C_CREATOR_SOLD_BEFORE_FILL.
  CreatorSoldBeforeFill creator_sold_before_fill = 7;
  // BSC_STRATEGY_C_CREATOR_SELL_EXIT.
  CreatorSellExit creator_sell_exit = 8;
  // BSC_STRATEGY_C_FILTERS: the rules in the native rule order.
  repeated StrategyFilterRule filters = 9;
  // BSC_STRATEGY_C_FIRST_BUYER_WINDOW: the buyers counted as early.
  optional uint32 first_buyer_window = 10;
}

// One settable key's bounds as the native parser enforces them (no client literal of a bound).
message StrategySettingSpec {
  // The native key, e.g. BSC_STRATEGY_C_HOLD_MS.
  string key = 1;
  // Its unit: wei, ratio, ms, count, enum or rules (BSC_STRATEGY_C_FILTERS).
  string unit = 2;
  // The smallest accepted value, exact decimal; absent: unbounded below.
  optional string min = 3;
  // The largest accepted value, exact decimal; absent: unbounded above.
  optional string max = 4;
  // Decimal places a value may have.
  uint32 places = 5;
}

// Whether a stored Strategy C configuration is in effect.
enum SettingsApplyStatus {
  // The running state is unknown: the runtime status does not read (provenance quality
  // INCOMPLETE, quality_reasons RUNTIME_STATUS_INVALID); never displayed as a value.
  SETTINGS_APPLY_STATUS_UNSPECIFIED = 0;
  // The running strategy took the stored revision at its start (its generation and its
  // configuration hash equal the stored ones).
  SETTINGS_APPLY_STATUS_IN_EFFECT = 1;
  // Stored; the running strategy keeps the revision of its start until its next start.
  SETTINGS_APPLY_STATUS_SAVED_APPLIES_NEXT_START = 2;
  // Strategy C does not run, or its runtime status is stale (quality_reasons
  // RUNTIME_STATUS_STALE): the stored revision applies at its next start.
  SETTINGS_APPLY_STATUS_NOT_RUNNING = 3;
  // The strategy refused its settings at its start (SETTINGS_REFUSED, GAS_EVIDENCE_REFUSED).
  SETTINGS_APPLY_STATUS_REFUSED = 4;
}

// The stored and the running Strategy C configuration of the native owner.
message StrategyCSettingsState {
  // Whether the native owner answered.
  Availability availability = 1;
  // Why it is not AVAILABLE.
  string unavailable_reason = 2;
  // The owner and its settings generation.
  OwnerProvenance provenance = 3;
  // The stored settable values (absent keys: the configuration file's).
  StrategyCSettings stored = 4;
  // The stored revision (settings generation): the compare-and-swap of the next save.
  uint64 stored_revision = 5;
  // The configuration hash of the stored revision's effective values.
  string stored_config_sha256 = 6;
  // What the running strategy took at its start, from a current runtime status only; absent while
  // it does not run or its status is stale.
  StrategyCSettings running = 7;
  // The revision the running strategy took; absent while it does not run.
  optional uint64 running_revision = 8;
  // The configuration hash of what the running strategy took; empty while it does not run.
  string running_config_sha256 = 9;
  // Whether the stored revision is in effect.
  SettingsApplyStatus apply_status = 10;
  // The strategy's refusal of its settings, `<SETTINGS_REFUSED|GAS_EVIDENCE_REFUSED>: <reason>`;
  // empty without one.
  string refusal_reason = 11;
  // The request that wrote the stored revision; empty while none.
  string request_id = 12;
  // The filterable features with their unit and places, in native order.
  repeated StrategyFeatureSpec features = 13;
  // The values in effect for the next start: every stored key over the configuration file's, the
  // read-only configuration values included.
  StrategyCSettings effective = 14;
  // The bounds of every settable key, in the native KEYS order.
  repeated StrategySettingSpec setting_specs = 15;
}

// Params of `bsc.strategy.set_all` (BSC-V8-04): the form's changes as ONE validated revision; a
// refused field refuses the whole set, nothing is stored half. Its receipt detail line is
// `outcome=<…> keys=<n> generation=<g> request_id=<…>[ reason=<…>]`.
message StrategyCSettingsSetAllCommand {
  // 1 was settings (StrategyCSettings, read-only values included); a command carries settable ones only.
  reserved 1;
  reserved "settings";
  // Every settable value.
  StrategyCSettableValues values = 2;
}

// The lifecycle of a training profile.
enum TrainingProfileStatus {
  // Not set by any producer; never displayed as a value.
  TRAINING_PROFILE_STATUS_UNSPECIFIED = 0;
  // Usable for runs and the LIVE selection.
  TRAINING_PROFILE_STATUS_ACTIVE = 1;
  // Kept with its runs and results, not selectable.
  TRAINING_PROFILE_STATUS_ARCHIVED = 2;
  // Deleted; kept only while a run or result references it.
  TRAINING_PROFILE_STATUS_DELETED = 3;
}

// A named, versioned Strategy C configuration of the native owner (one strategy, many profiles).
message TrainingProfile {
  // 4 was settings (StrategyCSettings); a profile stores the settable values only (values, 13).
  reserved 4;
  reserved "settings";
  // Stable owner identity, never reused.
  string profile_id = 1;
  // The operator's name.
  string name = 2;
  // The profile revision: the compare-and-swap of an update, delete or run start.
  uint64 revision = 3;
  // The configuration hash of this revision's effective values.
  string config_sha256 = 5;
  // The venues it trains on (BSC_VENUE_FLAP, BSC_VENUE_FOUR_CLASSIC, BSC_VENUE_OPENFOUR), as the
  // owner offers them; never an implicit "all markets".
  repeated string venues = 6;
  // Creation time, unix ms.
  uint64 created_unix_ms = 7;
  // Time of this revision, unix ms.
  uint64 updated_unix_ms = 8;
  // Its lifecycle.
  TrainingProfileStatus status = 9;
  // The runs that reference it, newest first (bounded; the run query has all).
  repeated string run_ids = 10;
  // Whether a running run or the LIVE selection uses it (edits then need a clone).
  bool in_use = 11;
  // What uses it; empty when not in use.
  string in_use_reason = 12;
  // Every settable value of this revision.
  StrategyCSettableValues values = 13;
  // The request that wrote this revision.
  string request_id = 14;
}

// The training profiles of the native owner.
message TrainingProfiles {
  // Whether the native owner answered.
  Availability availability = 1;
  // Why it is not AVAILABLE.
  string unavailable_reason = 2;
  // The owner and its catalog version.
  OwnerProvenance provenance = 3;
  // Every non-deleted profile.
  repeated TrainingProfile profiles = 4;
  // The catalog version: the compare-and-swap of a create or clone.
  uint64 catalog_version = 5;
  // The profile the LIVE selection names; empty without one.
  string live_profile_id = 6;
  // The revision the LIVE selection is bound to.
  optional uint64 live_profile_revision = 7;
}

// A bounded read of the training profiles.
message TrainingProfilesQuery {
  // Also archived profiles.
  bool include_archived = 1;
}

// Params of `bsc.training.profile.create` (prepared).
message TrainingProfileCreateCommand {
  // 2 was settings (StrategyCSettings); a command carries settable values only.
  reserved 2;
  reserved "settings";
  // The operator's name.
  string name = 1;
  // The venues it trains on.
  repeated string venues = 3;
  // Every settable value.
  StrategyCSettableValues values = 4;
}

// Params of `bsc.training.profile.update` (prepared): a new revision of one profile.
message TrainingProfileUpdateCommand {
  // 3 was settings (StrategyCSettings); a command carries settable values only.
  reserved 3;
  reserved "settings";
  // The profile (equal to CommandRequest.resource_id).
  string profile_id = 1;
  // The operator's name.
  string name = 2;
  // The venues it trains on.
  repeated string venues = 4;
  // Every settable value.
  StrategyCSettableValues values = 5;
}

// Params of `bsc.training.profile.clone` (prepared): a new profile from one revision.
message TrainingProfileCloneCommand {
  // The profile copied.
  string source_profile_id = 1;
  // The revision copied.
  uint64 source_revision = 2;
  // The new profile's name.
  string name = 3;
}

// Params of `bsc.training.profile.delete` (prepared): refused while a run or LIVE uses it.
message TrainingProfileDeleteCommand {
  // The profile.
  string profile_id = 1;
  // Archive instead of delete (runs and results stay readable either way).
  bool archive = 2;
}

// How a training run executes. Never with real funds or the LIVE wallet, nonce or budget.
enum TrainingRunMode {
  // Not set by any producer; never displayed as a value.
  TRAINING_RUN_MODE_UNSPECIFIED = 0;
  // PAPER: the BSC_RUNTIME_MODE PAPER path on live market data to the PAPER sink, nothing sent.
  TRAINING_RUN_MODE_PAPER = 1;
  // SHADOW: the engine's valuation only (decisions and exits valued by the exact curve), no sink.
  TRAINING_RUN_MODE_SHADOW = 2;
  // Offline replay of recorded journals (strategy-replay).
  TRAINING_RUN_MODE_REPLAY = 3;
}

// What ends a training run.
enum TrainingRunStopKind {
  // Not set by any producer; never displayed as a value.
  TRAINING_RUN_STOP_KIND_UNSPECIFIED = 0;
  // After duration_ms.
  TRAINING_RUN_STOP_KIND_DURATION = 1;
  // After max_launches qualified launches processed.
  TRAINING_RUN_STOP_KIND_LAUNCH_COUNT = 2;
  // Only by a stop request.
  TRAINING_RUN_STOP_KIND_UNTIL_STOPPED = 3;
}

// The bound of a training run: exactly the field its stop_kind names is set, the owner refuses any
// other combination.
message TrainingRunPlan {
  // What ends it.
  TrainingRunStopKind stop_kind = 1;
  // DURATION only: the run's length, milliseconds.
  optional uint64 duration_ms = 2;
  // LAUNCH_COUNT only: the qualified launches (the engine's Decided outputs) it processes.
  optional uint64 max_launches = 3;
}

// The lifecycle of a training run.
enum TrainingRunStatus {
  // Not set by any producer; never displayed as a value.
  TRAINING_RUN_STATUS_UNSPECIFIED = 0;
  // Accepted, not started.
  TRAINING_RUN_STATUS_PENDING = 1;
  // Running.
  TRAINING_RUN_STATUS_RUNNING = 2;
  // A stop was requested; the run seals its results.
  TRAINING_RUN_STATUS_STOPPING = 3;
  // Ended by its plan (duration or launch count).
  TRAINING_RUN_STATUS_COMPLETED = 4;
  // Ended by a stop request.
  TRAINING_RUN_STATUS_STOPPED = 5;
  // Ended by a failure (stop_reason).
  TRAINING_RUN_STATUS_FAILED = 6;
  // The owner cannot tell (state unreadable, crash before seal).
  TRAINING_RUN_STATUS_UNKNOWN = 7;
  // The runtime ended or restarted under it: sealed up to its last journal record, never resumed.
  TRAINING_RUN_STATUS_INTERRUPTED = 8;
}

// A replay's comparison with the run it replays.
enum ReplayVerdict {
  // Not set by any producer; never displayed as a value.
  REPLAY_VERDICT_UNSPECIFIED = 0;
  // The replay's decisions and results equal the recorded ones.
  REPLAY_VERDICT_PASS = 1;
  // They differ (the first difference in quality_reasons).
  REPLAY_VERDICT_DIFFERS = 2;
  // The recorded journal has gaps; no verdict.
  REPLAY_VERDICT_INCOMPLETE = 3;
  // Not a replay, or not compared.
  REPLAY_VERDICT_NOT_RUN = 4;
}

// The results of one training run, from its native journal; counts are the journal's, its quality says
// how complete; net_wei stays absent while unresolved, never zero.
message TrainingResult {
  // Launches the strategy evaluated.
  uint64 evaluated = 1;
  // Of them passed every filter.
  uint64 passed = 2;
  // Of them rejected by a filter.
  uint64 rejected = 3;
  // Of them DATA_INCOMPLETE (a coverage gap, never a pass).
  uint64 data_incomplete = 4;
  // Launches not tracked (the venue or curve not exact).
  uint64 not_tracked = 5;
  // Positions whose value is unresolved (the curve stopped being exact).
  uint64 unresolved = 6;
  // PAPER entries.
  uint64 entered = 7;
  // Exits at the target.
  uint64 exits_target = 8;
  // Exits at the stop.
  uint64 exits_stop = 9;
  // Exits by a creator sale.
  uint64 exits_creator_sell = 10;
  // Exits at the hold timeout.
  uint64 exits_timeout = 11;
  // Closed positions with a gain.
  uint64 wins = 12;
  // Closed positions with a loss.
  uint64 losses = 13;
  // Sum of the gains, decimal wei.
  string gain_wei = 14;
  // Sum of the losses, decimal wei (a positive amount).
  string loss_wei = 15;
  // Net result after every cost, signed decimal wei; absent while unresolved positions exist.
  optional string net_wei = 16;
  // Positions still open.
  uint64 open_positions = 17;
  // The ingress sources the run observed.
  repeated string sources = 18;
  // The observed market time with complete coverage, ms.
  optional uint64 observable_ms = 19;
  // Records lost by the capture.
  uint64 lost_records = 20;
  // Ingress messages dropped.
  uint64 ingress_dropped = 21;
  // How far these counts are proven (INCOMPLETE while the run's journal is not sealed or has gaps);
  // a result the owner cannot read at all is the whole message absent.
  DataQuality quality = 22;
  // Why the quality is not VERIFIED.
  repeated string quality_reasons = 23;
  // Entries refused because max_open slots were full.
  uint64 slot_limit = 24;
  // Launches whose creator sold before the BUY filled.
  uint64 creator_sold = 25;
  // Entries cancelled before execution (the four counts below together).
  uint64 cancelled = 26;
  // Of them by a creator sale (FREE_CANCEL).
  uint64 cancelled_creator_sold = 27;
  // Of them because the launch is not tracked.
  uint64 cancelled_not_tracked = 28;
  // Of them by a quote error.
  uint64 cancelled_quote = 29;
  // Of them by a cost error.
  uint64 cancelled_cost = 30;
  // Entries superseded by a later decision on the same token.
  uint64 superseded = 31;
  // PAPER positions without an exact price (no value, never zero).
  uint64 paper_unpriced = 32;
  // Positions still open when the run ended.
  uint64 open_at_end = 33;
  // REPLAY: the comparison with the recorded run; NOT_RUN otherwise.
  ReplayVerdict replay_verdict = 34;
  // REPLAY: whether the replayed configuration hash equals the recorded run's; absent otherwise.
  optional bool config_match = 35;
}

// One training run of a profile revision.
message TrainingRun {
  // Stable run identity, never reused.
  string run_id = 1;
  // The profile it runs.
  string profile_id = 2;
  // The profile revision it runs.
  uint64 profile_revision = 3;
  // The configuration hash it runs.
  string config_sha256 = 4;
  // How it executes.
  TrainingRunMode mode = 5;
  // The venues it trains on.
  repeated string venues = 6;
  // Its bound.
  TrainingRunPlan plan = 7;
  // Start, unix ms; absent before it started.
  optional uint64 started_unix_ms = 8;
  // End, unix ms; absent while running.
  optional uint64 ended_unix_ms = 9;
  // Its lifecycle.
  TrainingRunStatus status = 10;
  // Why it ended (PLAN_DURATION, PLAN_LAUNCH_COUNT, STOP_REQUESTED, a failure); empty while running.
  string stop_reason = 11;
  // Qualified launches processed so far.
  uint64 launches_processed = 12;
  // Its results so far.
  TrainingResult result = 13;
  // The owner and journal the run was read from.
  OwnerProvenance provenance = 14;
  // The request that started it.
  string request_id = 15;
  // REPLAY: the ReplaySource.source_id it replays (echo of the start); empty otherwise.
  string replay_source = 16;
}

// Params of `bsc.training.run.start` (prepared).
message TrainingRunStartCommand {
  // The profile.
  string profile_id = 1;
  // How it executes.
  TrainingRunMode mode = 2;
  // The venues it trains on (a subset of the profile's).
  repeated string venues = 3;
  // Its bound.
  TrainingRunPlan plan = 4;
  // REPLAY: a ReplaySource.source_id of the owner's catalogue (never a path); empty for PAPER and
  // SHADOW.
  string replay_source = 5;
}

// Params of `bsc.training.run.stop` (prepared); CommandRequest.resource_id names the run.
message TrainingRunStopCommand {
  // Why the operator stops it (free text, diagnostic only).
  string reason = 1;
}

// Params of `bsc.live.strategy.select` (prepared, FE-V8-09): LIVE takes one profile revision as ONE
// atomic Strategy C configuration, or the custom settings; never a local draft.
message LiveStrategySelectCommand {
  // The profile; empty: the custom settings (StrategyCSettingsSetAllCommand) stay in effect.
  string profile_id = 1;
  // The revision bound (it must be the profile's current one).
  uint64 profile_revision = 2;
  // The configuration hash of that revision the operator saw.
  string config_sha256 = 3;
  // The stored settings generation the selection replaces (StrategyCSettingsState.stored_revision):
  // the compare-and-swap of the ONE generation it writes.
  uint64 expected_settings_generation = 4;
}

// A read of the stored and running Strategy C configuration.
message StrategyCSettingsQuery {
  // Also the filterable feature catalogue (StrategyFeatureSpec).
  bool include_features = 1;
}

// A bounded, cursor-paged read of training runs.
message TrainingRunQuery {
  // Only runs of this profile; empty: every profile.
  string profile_id = 1;
  // Only runs in these states; empty: every state.
  repeated TrainingRunStatus statuses = 2;
  // The previous page's next_cursor; empty: the first page.
  string cursor = 3;
  // At most this many runs; 0: the owner's default; above its cap: refused (LIMIT_EXCEEDED).
  uint32 limit = 4;
}

// One page of training runs, newest first, bound to one owner snapshot.
message TrainingRunPage {
  // Whether the native owner answered.
  Availability availability = 1;
  // Why it is not AVAILABLE.
  string unavailable_reason = 2;
  // The owner and the snapshot the cursor is bound to.
  OwnerProvenance provenance = 3;
  // The runs.
  repeated TrainingRun runs = 4;
  // The cursor of the next page; empty on the last one.
  string next_cursor = 5;
  // Whether another page follows.
  bool has_more = 6;
}

// A bounded read of the owner's replay catalogue.
message ReplaySourceQuery {
  // The previous page's next_cursor; empty: the first page.
  string cursor = 1;
  // At most this many sources; 0: the owner's default; above its cap: refused (LIMIT_EXCEEDED).
  uint32 limit = 2;
}

// One recorded run or journal the owner can replay, named by its catalogue id only (never a path).
message ReplaySource {
  // The catalogue id a REPLAY start names.
  string source_id = 1;
  // RECORDED_RUN or MARKET_JOURNAL.
  string kind = 2;
  // The recorded training run, when it is one; empty otherwise.
  string run_id = 3;
  // Its first block; absent when unknown.
  optional uint64 from_block = 4;
  // Its last block; absent when unknown.
  optional uint64 to_block = 5;
  // Its first record's time.
  SourcedTime from = 6;
  // Its last record's time.
  SourcedTime to = 7;
  // Records in it.
  uint64 records = 8;
  // The configuration hash it was recorded with; empty for a market journal.
  string config_sha256 = 9;
  // How complete it is (INCOMPLETE with gaps).
  DataQuality quality = 10;
  // Why the quality is not VERIFIED.
  repeated string quality_reasons = 11;
}

// One page of the replay catalogue, newest first, bound to one owner snapshot.
message ReplaySourcePage {
  // Whether the native owner answered.
  Availability availability = 1;
  // Why it is not AVAILABLE.
  string unavailable_reason = 2;
  // The owner and the snapshot the cursor is bound to.
  OwnerProvenance provenance = 3;
  // The sources.
  repeated ReplaySource sources = 4;
  // The cursor of the next page; empty on the last one.
  string next_cursor = 5;
  // Whether another page follows.
  bool has_more = 6;
}
