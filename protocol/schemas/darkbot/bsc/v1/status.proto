syntax = "proto3";
package darkbot.bsc.v1;

// An explicitly selected public bound value, never a signed transaction or secret.
message PublicField {
  // Stable name from the native evidence schema.
  string name = 1;
  // Exact text; monetary integers use decimal wei, never floating point.
  string value = 2;
}
// Source identity of immutable evidence. Missing evidence is not a pass.
message Evidence {
  // Path relative to the staged BSC source root.
  string path = 1;
  // SHA-256 of the exact original bytes.
  string sha256 = 2;
  // Time recorded by the producer, not file mtime.
  uint64 observed_unix_s = 3;
}
// Public guard observation. This message cannot authorize execution.
message GuardStatus {
  // Compiled authority hash or UNARMED.
  string frozen_approved_sha256 = 1;
  // UNARMED, ARMED, ARMED_MISMATCH or UNKNOWN.
  string guard_state = 2;
  // Only the current V5 contract path is authoritative.
  string contract_path = 3;
  // Whether the current contract exists.
  bool contract_present = 4;
  // Hash of the current contract bytes, if present.
  string contract_sha256 = 5;
  // Absent if no valid contract can be inspected.
  optional bool approved = 6;
  // Absent if no valid contract can be inspected.
  optional bool execution_ready = 7;
  // Bound attempt identity.
  string attempt_id = 8;
  // Bound attempt maximum.
  optional uint64 max_attempts = 9;
}
// Qualification status derived from identified evidence.
message GateStatus {
  // G0.6a, G0.7, G0.8, C1.9 or C1.10.
  string gate_id = 1;
  // Native vocabulary, transported unchanged. G0.6a: PASS, FAIL or UNKNOWN. G0.7:
  // NOT_EXECUTED, UNKNOWN or the attempt classification (PROVISIONAL_RELEASED__*,
  // SUBMITTED_OR_SUBMISSION_UNKNOWN__*, STOP_CAPTURE_INCOMPLETE__*), none of which is a
  // success. G0.8: NOT_EXECUTED, UNKNOWN, PASS, ADAPT, STOP or UNRESOLVED. C1.x: UNKNOWN.
  string state = 2;
  // Original evidence identity.
  Evidence evidence = 3;
  // Reasons explaining this observation.
  repeated string reason_codes = 4;
}
// Native read-only readiness result and its original timestamp.
message ReadinessStatus {
  // PASS_READ_ONLY, BLOCKED (a required condition is missing), STOP (a contradiction),
  // NOT_RUN or UNKNOWN, unchanged from the native record; never LIVE authority.
  string verdict = 1;
  // Source evidence, possibly historical.
  Evidence evidence = 2;
  // Funding result, if reported.
  string funding_verdict = 3;
  // Individual native checks and their public details.
  repeated PublicField checks = 4;
  // Bound portal version.
  string portal_version_bound = 5;
  // Observed portal version.
  string portal_version_observed = 6;
  // Bound implementation address.
  string portal_impl_bound = 7;
  // Observed implementation address.
  string portal_impl_observed = 8;
  // Absent when no comparison was performed.
  optional bool code_hash_changed = 9;
  // Block for the readiness observation, when recorded.
  optional uint64 head_block = 10;
  // Reported reasons for blocking.
  repeated string reasons = 11;
  // READ_ONLY_RPC or OFFLINE_ZERO_EGRESS as recorded natively; empty without a record.
  string mode = 12;
  // Binding to the current offline candidate selection: BOUND (observed after the switch,
  // with a passing CANDIDATE_SELECTION check for it), STALE (older or another selection),
  // NO_SELECTION, or UNKNOWN (no record or an invalid candidate mirror).
  string candidate_binding = 13;
}
// Builder documentation and empirical qualification are separate observations.
message BuilderStatus {
  // Actual fetch time recorded in evidence.
  uint64 refresh_observed_unix_s = 1;
  // Refresh expires after 24 hours; zero means unknown.
  uint64 refresh_expires_unix_s = 2;
  // Explicit documented floors in exact decimal wei.
  repeated PublicField floors = 3;
  // Probe evidence identity.
  Evidence probe = 4;
  // QUALIFIED or UNQUALIFIED; a response alone does not qualify price.
  string price = 5;
  // Empirical qualification of noMerge effects.
  string no_merge = 6;
  // Empirical qualification of positionFirst effects.
  string position_first = 7;
  // Empirical qualification of actual inclusion.
  string inclusion = 8;
}
// Original producer witness availability, not inferred timing.
message WitnessStatus {
  // Absent when the witness contract cannot be read.
  optional bool source_ready = 1;
  // UNKNOWN until original execution witnesses prove timing.
  string t0_to_buy_state = 2;
  // Witness contract identity.
  Evidence evidence = 3;
}
// Historical DRY parameters; reporting never runs signing or simulation.
message DryStatus {
  // Native DRY evidence identity.
  Evidence evidence = 1;
  // Evidence run identity.
  string dry_id = 2;
  // PASS, FAIL or UNKNOWN.
  string state = 3;
  // Exact public parameters and results from the record.
  repeated PublicField parameters = 4;
  // Absent without a qualified current deployment comparison.
  optional bool valid_for_current_portal = 5;
}
// Supervisor-owned read-only job lifecycle.
message JobStatus {
  // Only readiness is currently controllable.
  string job = 1;
  // Process lifecycle only: RUNNING, STOPPING, STOPPED (ended; see result_code), FAILED
  // (runner or process failure) or UNKNOWN. Never a readiness verdict.
  string state = 2;
  // Unique launch identity; never reused across runs.
  string launch_id = 3;
  // Start time recorded by the controller.
  uint64 started_unix_s = 4;
  // Completion time recorded by the controller.
  uint64 ended_unix_s = 5;
  // Result of this launch, not an earlier one: the native verdict PASS_READ_ONLY, BLOCKED
  // or STOP, STOPPED when stopped on request, FAILED on a technical failure.
  string result_code = 6;
  // Whether the supervisor can control the job (deployed readiness binary and snapshot).
  optional bool controller_available = 7;
}
// Kind of a native leaf; the value is its canonical text form.
enum NativeKind {
  // Not set; never displayed as a value.
  NATIVE_KIND_UNSPECIFIED = 0;
  // true or false.
  NATIVE_KIND_BOOL = 1;
  // Unsigned decimal.
  NATIVE_KIND_U64 = 2;
  // Signed decimal.
  NATIVE_KIND_I64 = 3;
  // Exact unsigned decimal (wei, token units); never a float.
  NATIVE_KIND_U256 = 4;
  // 0x followed by 40 hex digits.
  NATIVE_KIND_ADDRESS = 5;
  // 0x followed by 64 hex digits.
  NATIVE_KIND_B256 = 6;
  // Redacted public text.
  NATIVE_KIND_TEXT = 7;
}
// One public leaf of a native record. Secrets, salts, raw bytes and private records never
// appear; the census sensitivity of every leaf decides (bsc-native-fields.json).
message NativeField {
  // DBREC field name; nested rows as parent[index].name, repeated leaves as name[index].
  string name = 1;
  // DBREC kind of the leaf.
  NativeKind kind = 2;
  // Canonical text of the value for its kind.
  string value = 3;
  // Native unit such as wei, unix_milliseconds, nanoseconds or basis_points.
  string unit = 4;
}
// The public leaves of one identified native record. The frontend places every field by
// frontend/contracts/bsc-fields.json (panel, section, order); nothing is computed from it.
message NativeRecord {
  // DBREC schema name.
  string schema = 1;
  // Record identity: path, SHA-256 and native observation time.
  Evidence evidence = 2;
  // NATIVE_CREATED, LEGACY_IMPORTED_AUDITED or UNKNOWN.
  string provenance = 3;
  // Public leaves in native schema order.
  repeated NativeField fields = 4;
}
// Read-only BSC evidence projection.
message BscStatus {
  // Source revision deployed with this reporter.
  string source_commit = 1;
  // Projection evaluation time, not qualification freshness.
  uint64 evaluated_unix_s = 2;
  // BLOCKED: the GUI never enables trading.
  string live_state = 3;
  // Compiled guard and current contract observation.
  GuardStatus guard = 4;
  // Separate qualification gates.
  repeated GateStatus gates = 5;
  // Latest native readiness evidence.
  ReadinessStatus readiness = 6;
  // Builder observations.
  BuilderStatus builder = 7;
  // Producer witness status.
  WitnessStatus witness = 8;
  // Historical DRY status and exact values.
  DryStatus dry = 9;
  // Read-only jobs observed by launchd.
  repeated JobStatus jobs = 10;
  // Missing or invalid data is made explicit.
  repeated string warnings = 11;
  // Time of the explicit source snapshot sync, never evidence freshness.
  uint64 data_as_of_unix_s = 12;
}
// Bound launch plan, without signatures, raw transactions or execution authority.
message BscLaunchState {
  // True only if the current V5 contract is present and valid.
  bool contract_present = 1;
  // Contract identity.
  Evidence evidence = 2;
  // Public contract values, exact integer caps and binding hashes.
  repeated PublicField contract_fields = 3;
  // Observed runtime context; absent until such evidence actually exists.
  repeated PublicField runtime_fields = 4;
  // Missing/invalid contract explanation.
  string reason = 5;
  // Latest public qualification records: DRY, preflight, quote, economics, simulation,
  // launch path, R0 portal scan, requalification, PREPARE handoff and the V5 contract.
  repeated NativeRecord records = 6;
}
// Read-only G0.8 results; submission acknowledgement is not acquisition.
message BscMonitoringState {
  // G0.8 verdict unchanged: NOT_EXECUTED, PASS, ADAPT, STOP, UNRESOLVED or UNKNOWN.
  string state = 1;
  // G0.8 result identity.
  Evidence evidence = 2;
  // Explicit public receipt, ordering, acquisition and cost fields.
  repeated PublicField results = 3;
  // Latest public builder, witness, G0.7 attempt, G0.8 and chain-session records.
  repeated NativeRecord records = 4;
}
// Public wallet identity and timestamped evidence balances, never keys.
message BscWalletsState {
  // Optional configured public identity.
  string expected_address = 1;
  // Public wallet configuration state.
  string wallet_status = 2;
  // Launcher address from bound evidence.
  string launcher_address = 3;
  // Buyer address from bound evidence.
  string buyer_address = 4;
  // Chain identity when recorded.
  optional uint64 chain_id = 5;
  // Exact balance snapshot; absent if unknown.
  optional string launcher_balance_wei = 6;
  // Exact balance snapshot; absent if unknown.
  optional string buyer_balance_wei = 7;
  // Block of the balance snapshot.
  optional uint64 observed_block = 8;
  // Time of the balance snapshot, not reporter time.
  uint64 observed_unix_s = 9;
  // READINESS_SNAPSHOT or HISTORICAL_PREFLIGHT; no implicit live RPC.
  string source = 10;
  // Exact launcher funding requirement when recorded.
  optional string required_launcher_wei = 11;
  // Exact buyer funding requirement when recorded.
  optional string required_buyer_wei = 12;
  // Evidence identity makes snapshot age and provenance reviewable.
  Evidence evidence = 13;
}
