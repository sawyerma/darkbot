syntax = "proto3";
package darkbot.bsc.v1;

// An explicitly selected public bound value, never a signed transaction or secret.
message PublicField {
  // Stable name from the native evidence schema.
  string name = 1;
  // Exact text; monetary integers use decimal wei, never floating point.
  string value = 2;
}
// Source identity of immutable evidence. Missing evidence is not a pass.
message Evidence {
  // Path relative to the staged BSC source root.
  string path = 1;
  // SHA-256 of the exact original bytes.
  string sha256 = 2;
  // Time recorded by the producer, not file mtime.
  uint64 observed_unix_s = 3;
}
// Public guard observation. This message cannot authorize execution.
message GuardStatus {
  // Compiled authority hash or UNARMED.
  string frozen_approved_sha256 = 1;
  // UNARMED, ARMED, ARMED_MISMATCH or UNKNOWN.
  string guard_state = 2;
  // Only the current V5 contract path is authoritative.
  string contract_path = 3;
  // Whether the current contract exists.
  bool contract_present = 4;
  // Hash of the current contract bytes, if present.
  string contract_sha256 = 5;
  // Absent if no valid contract can be inspected.
  optional bool approved = 6;
  // Absent if no valid contract can be inspected.
  optional bool execution_ready = 7;
  // Bound attempt identity.
  string attempt_id = 8;
  // Bound attempt maximum.
  optional uint64 max_attempts = 9;
}
// Qualification status derived from identified evidence.
message GateStatus {
  // G0.6a, G0.7, G0.8, C1.9 or C1.10.
  string gate_id = 1;
  // Native vocabulary, transported unchanged. G0.6a: PASS, FAIL or UNKNOWN. G0.7:
  // NOT_EXECUTED, UNKNOWN or the attempt classification (PROVISIONAL_RELEASED__*,
  // SUBMITTED_OR_SUBMISSION_UNKNOWN__*, STOP_CAPTURE_INCOMPLETE__*), none of which is a
  // success. G0.8: NOT_EXECUTED, UNKNOWN, PASS, ADAPT, STOP or UNRESOLVED. C1.x: UNKNOWN.
  string state = 2;
  // Original evidence identity.
  Evidence evidence = 3;
  // Reasons explaining this observation.
  repeated string reason_codes = 4;
}
// Native read-only readiness result and its original timestamp.
message ReadinessStatus {
  // PASS_READ_ONLY, BLOCKED (a required condition is missing), STOP (a contradiction),
  // NOT_RUN or UNKNOWN, unchanged from the native record; never LIVE authority.
  string verdict = 1;
  // Source evidence, possibly historical.
  Evidence evidence = 2;
  // Funding result, if reported.
  string funding_verdict = 3;
  // Individual native checks and their public details.
  repeated PublicField checks = 4;
  // Bound portal version.
  string portal_version_bound = 5;
  // Observed portal version.
  string portal_version_observed = 6;
  // Bound implementation address.
  string portal_impl_bound = 7;
  // Observed implementation address.
  string portal_impl_observed = 8;
  // Absent when no comparison was performed.
  optional bool code_hash_changed = 9;
  // Block for the readiness observation, when recorded.
  optional uint64 head_block = 10;
  // Reported reasons for blocking.
  repeated string reasons = 11;
  // READ_ONLY_RPC or OFFLINE_ZERO_EGRESS as recorded natively; empty without a record.
  string mode = 12;
  // Binding to the current offline candidate selection: BOUND (observed after the switch,
  // with a passing CANDIDATE_SELECTION check for it), STALE (older or another selection),
  // NO_SELECTION, or UNKNOWN (no record or an invalid candidate mirror).
  string candidate_binding = 13;
}
// Builder documentation and empirical qualification are separate observations.
message BuilderStatus {
  // Actual fetch time recorded in evidence.
  uint64 refresh_observed_unix_s = 1;
  // Refresh expires after 24 hours; zero means unknown.
  uint64 refresh_expires_unix_s = 2;
  // Explicit documented floors in exact decimal wei.
  repeated PublicField floors = 3;
  // Probe evidence identity.
  Evidence probe = 4;
  // QUALIFIED or UNQUALIFIED; a response alone does not qualify price.
  string price = 5;
  // Empirical qualification of noMerge effects.
  string no_merge = 6;
  // Empirical qualification of positionFirst effects.
  string position_first = 7;
  // Empirical qualification of actual inclusion.
  string inclusion = 8;
}
// Original producer witness availability, not inferred timing.
message WitnessStatus {
  // Absent when the witness contract cannot be read.
  optional bool source_ready = 1;
  // UNKNOWN until original execution witnesses prove timing.
  string t0_to_buy_state = 2;
  // Witness contract identity.
  Evidence evidence = 3;
}
// Historical DRY parameters; reporting never runs signing or simulation.
message DryStatus {
  // Native DRY evidence identity.
  Evidence evidence = 1;
  // Evidence run identity.
  string dry_id = 2;
  // PASS, FAIL or UNKNOWN.
  string state = 3;
  // Exact public parameters and results from the record.
  repeated PublicField parameters = 4;
  // Absent without a qualified current deployment comparison.
  optional bool valid_for_current_portal = 5;
}
// Supervisor-owned read-only job lifecycle.
message JobStatus {
  // Only readiness is currently controllable.
  string job = 1;
  // Process lifecycle only: RUNNING, STOPPING, STOPPED (ended; see result_code), FAILED
  // (runner or process failure) or UNKNOWN. Never a readiness verdict.
  string state = 2;
  // Unique launch identity; never reused across runs.
  string launch_id = 3;
  // Start time recorded by the controller.
  uint64 started_unix_s = 4;
  // Completion time recorded by the controller.
  uint64 ended_unix_s = 5;
  // Result of this launch, not an earlier one: the native verdict PASS_READ_ONLY, BLOCKED
  // or STOP, STOPPED when stopped on request, FAILED on a technical failure.
  string result_code = 6;
  // Whether the supervisor can control the job (deployed readiness binary and snapshot).
  optional bool controller_available = 7;
}
// Kind of a native leaf; the value is its canonical text form.
enum NativeKind {
  // Not set; never displayed as a value.
  NATIVE_KIND_UNSPECIFIED = 0;
  // true or false.
  NATIVE_KIND_BOOL = 1;
  // Unsigned decimal.
  NATIVE_KIND_U64 = 2;
  // Signed decimal.
  NATIVE_KIND_I64 = 3;
  // Exact unsigned decimal (wei, token units); never a float.
  NATIVE_KIND_U256 = 4;
  // 0x followed by 40 hex digits.
  NATIVE_KIND_ADDRESS = 5;
  // 0x followed by 64 hex digits.
  NATIVE_KIND_B256 = 6;
  // Redacted public text.
  NATIVE_KIND_TEXT = 7;
}
// One public leaf of a native record. Secrets, salts, raw bytes and private records never
// appear; the census sensitivity of every leaf decides (bsc-native-fields.json).
message NativeField {
  // DBREC field name; nested rows as parent[index].name, repeated leaves as name[index].
  string name = 1;
  // DBREC kind of the leaf.
  NativeKind kind = 2;
  // Canonical text of the value for its kind.
  string value = 3;
  // Native unit such as wei, unix_milliseconds, nanoseconds or basis_points.
  string unit = 4;
}
// The public leaves of one identified native record. The frontend places every field by
// frontend/contracts/bsc-fields.json (panel, section, order); nothing is computed from it.
message NativeRecord {
  // DBREC schema name.
  string schema = 1;
  // Record identity: path, SHA-256 and native observation time.
  Evidence evidence = 2;
  // NATIVE_CREATED, LEGACY_IMPORTED_AUDITED or UNKNOWN.
  string provenance = 3;
  // Public leaves in native schema order.
  repeated NativeField fields = 4;
}
// The BSC evidence projection: guard, gates, readiness, builder, witness, DRY and jobs. LIVE is
// not projected here: bsc.live.state (BscLiveState) is its one source.
message BscStatus {
  // 3 was live_state, a second copy of the LIVE state; BscLiveState is the one LIVE source.
  reserved 3;
  reserved "live_state";
  // Source revision of the deployed snapshot (its COMMIT); UNKNOWN without a readable one.
  string source_commit = 1;
  // Projection evaluation time, not qualification freshness.
  uint64 evaluated_unix_s = 2;
  // Compiled guard and current contract observation.
  GuardStatus guard = 4;
  // Separate qualification gates.
  repeated GateStatus gates = 5;
  // Latest native readiness evidence.
  ReadinessStatus readiness = 6;
  // Builder observations.
  BuilderStatus builder = 7;
  // Producer witness status.
  WitnessStatus witness = 8;
  // Historical DRY status and exact values.
  DryStatus dry = 9;
  // Read-only jobs observed by launchd.
  repeated JobStatus jobs = 10;
  // Missing or invalid data is made explicit.
  repeated string warnings = 11;
  // Time of the explicit source snapshot sync (its SYNCED_AT), never evidence freshness; 0 is
  // UNKNOWN (no readable sync time, warning SNAPSHOT_SYNC_TIME_UNKNOWN).
  uint64 data_as_of_unix_s = 12;
}
// One native wallet or economic switch (plan 27.10.) of the bsc_runtime owner: a permission
// a Mainnet signing or sending path checks besides its own guard, V5, nonce and budget checks,
// never an action. DISABLED initially, in a missing or unreadable state and after every restart.
message ControlSwitch {
  // Native ID: BSC_WALLET_LAUNCHER, BSC_WALLET_BUYER, BSC_ECON_SIGN, BSC_ECON_ARM,
  // BSC_ECON_SEND, BSC_ECON_ATTEMPT or BSC_ECON_LIVE.
  string id = 1;
  // DISABLED or ENABLED as requested; UNKNOWN when the owner state is unreadable.
  string requested = 2;
  // DISABLED, ENABLED, or BLOCKED as the owner holds it in this boot session.
  string effective = 3;
  // Why the effective state is not the requested one (RESET_BY_RESTART, CONTROL_STATE_INVALID).
  string block_reason = 4;
  // The owner generation; the compare-and-swap of the next request.
  uint64 generation = 5;
  // The request (or RESTART_RESET) that last set this switch; empty while never set.
  string request_id = 6;
  // The generation that request wrote.
  optional uint64 set_generation = 7;
}
// The persisted daily limit of economic BUY attempts (plan 27.10.) at the native owner and
// its use on the current UTC day; every attempt that may send takes a slot before its
// authority is consumed. A limit is never a permission to execute.
message BuyAttemptLimit {
  // Attempts allowed per UTC calendar day; 0 (initially) allows none.
  uint64 per_day = 1;
  // The UTC calendar day counted, YYYY-MM-DD.
  string day_utc = 2;
  // Slots taken on that day, sent or unclear attempts included.
  uint64 used = 3;
  // per_day minus used, never below zero.
  uint64 remaining = 4;
  // The owner generation; the compare-and-swap of the next request.
  uint64 generation = 5;
  // The request that last set the limit; empty while never set.
  string request_id = 6;
  // The generation that request wrote.
  optional uint64 set_generation = 7;
}
// Bound launch plan, without signatures, raw transactions or execution authority.
message BscLaunchState {
  // True only if the current V5 contract is present and valid.
  bool contract_present = 1;
  // Contract identity.
  Evidence evidence = 2;
  // Public contract values, exact integer caps and binding hashes.
  repeated PublicField contract_fields = 3;
  // Observed runtime context; absent until such evidence actually exists.
  repeated PublicField runtime_fields = 4;
  // Missing/invalid contract explanation.
  string reason = 5;
  // Latest public qualification records: DRY, preflight, quote, economics, simulation,
  // launch path, R0 portal scan, requalification, PREPARE handoff and the V5 contract.
  repeated NativeRecord records = 6;
  // The economic switches SIGN, ARM, SEND, ATTEMPT and LIVE of the native owner; absent
  // before its state exists.
  repeated ControlSwitch economic_controls = 7;
  // The daily BUY attempt limit and today's use; absent before the owner state exists.
  BuyAttemptLimit buy_attempt_limit = 8;
  // The global runtime mode BSC_RUNTIME_MODE (OFF, SHADOW, PAPER or LIVE; a requested LIVE is
  // effective only while the owner's LIVE gate holds, BscLiveState) in the ControlSwitch shape;
  // absent before the owner state exists.
  ControlSwitch runtime_mode = 9;
}
// Read-only G0.8 results; submission acknowledgement is not acquisition.
message BscMonitoringState {
  // G0.8 verdict unchanged: NOT_EXECUTED, PASS, ADAPT, STOP, UNRESOLVED or UNKNOWN.
  string state = 1;
  // G0.8 result identity.
  Evidence evidence = 2;
  // Explicit public receipt, ordering, acquisition and cost fields.
  repeated PublicField results = 3;
  // Latest public builder, witness, G0.7 attempt, G0.8 and chain-session records.
  repeated NativeRecord records = 4;
}
// Public wallet identity and timestamped evidence balances, never keys.
message BscWalletsState {
  // The configured LIVE buyer (BSC_LIVE_BUYER of the runtime configuration), 0x hex; empty
  // without one.
  string expected_address = 1;
  // WATCHED: the runtime configuration names that LIVE buyer and C2 watches it; UNKNOWN without
  // a readable LIVE configuration.
  string wallet_status = 2;
  // Launcher address from bound evidence.
  string launcher_address = 3;
  // Buyer address from bound evidence.
  string buyer_address = 4;
  // Chain identity when recorded.
  optional uint64 chain_id = 5;
  // Exact balance snapshot; absent if unknown.
  optional string launcher_balance_wei = 6;
  // Exact balance snapshot; absent if unknown.
  optional string buyer_balance_wei = 7;
  // Block of the balance snapshot.
  optional uint64 observed_block = 8;
  // Time of the balance snapshot, not reporter time.
  uint64 observed_unix_s = 9;
  // READINESS_SNAPSHOT or HISTORICAL_PREFLIGHT; no implicit live RPC.
  string source = 10;
  // Exact launcher funding requirement when recorded.
  optional string required_launcher_wei = 11;
  // Exact buyer funding requirement when recorded.
  optional string required_buyer_wei = 12;
  // Evidence identity makes snapshot age and provenance reviewable.
  Evidence evidence = 13;
  // The launcher wallet's native ENABLE/DISABLE switch; absent before the owner state exists.
  ControlSwitch launcher_control = 14;
  // The buyer wallet's native ENABLE/DISABLE switch; absent before the owner state exists.
  ControlSwitch buyer_control = 15;
}
// One condition of the native owner's LIVE gate (plan 28.10.), in the order an operator meets
// them; LIVE is effective only while every one holds.
message LivePrecondition {
  // Stable condition ID, e.g. ECONOMIC_LIVE, LIVE_GRANT, WALLET_BUYER, ECON_SEND, RUNTIME_LIVE,
  // BUY_LIMIT_DAILY, BUY_LIMIT_TOTAL, GRANT_ATTEMPTS, GRANT_SPEND, GRANT_BUYS, GRANT_RISK, VENUE_QUALIFIED,
  // SOURCES_QUALIFIED, ADAPTERS_QUALIFIED, ACQUISITION_PROVEN or RISK_DECISION.
  string id = 1;
  // Whether the condition holds now.
  bool met = 2;
  // The owner's reason when it does not (the gate's own block reason).
  string reason = 3;
}
// The operator's LIVE grant of one scope as the native owner holds it.
message LiveGrant {
  // The venue, e.g. BSC_VENUE_FLAP.
  string venue = 1;
  // C3, STRATEGY_C or C3+STRATEGY_C.
  string strategies = 2;
  // Source IDs whose verified full sightings may trigger a BUY.
  repeated string sources = 3;
  // Inclusion adapters, e.g. CLUB48_BUILDER_V1.
  repeated string adapters = 4;
  // Largest BUY input, decimal wei.
  string max_input_wei = 5;
  // The grant's whole spend limit (inputs and gas), decimal wei.
  string max_spend_wei = 6;
  // BUY attempts the grant may take.
  uint32 max_attempts = 7;
  // Expiry, unix milliseconds.
  uint64 expires_unix_ms = 8;
  // SHA-256 of the canonical scope text the operator confirmed, lowercase hex.
  string scope_sha256 = 9;
  // The canonical scope text itself.
  string scope_text = 10;
  // The request that wrote the grant.
  string request_id = 11;
  // The owner generation that request wrote.
  uint64 set_generation = 12;
  // The grant admits the exits of open positions only, no BUY (BSC3-058).
  bool exit_only = 13;
  // The execution risk the operator granted (BSC3-069); absent in a grant written before it,
  // which admits nothing.
  LiveGrantRisk risk = 14;
  // The positions and losses the operator granted (31.10. order); absent in a grant written
  // before them, which arms nothing.
  LiveGrantLimits limits = 15;
}
// The positions and losses of a LIVE grant: a BUY beyond any of them is refused, exits go on.
message LiveGrantLimits {
  // Most positions open at once (a BUY pending, open or exiting counts).
  uint32 max_open_positions = 1;
  // Most realized net loss of the grant's positions, decimal wei.
  string max_realized_loss_wei = 2;
  // Most realized net loss of the positions closed on one UTC day, decimal wei.
  string max_daily_realized_loss_wei = 3;
  // Least time between two BUYs, milliseconds.
  uint64 min_buy_interval_ms = 4;
}
// The execution risk of a LIVE grant (BSC3-069): the executor arms only within it.
message LiveGrantRisk {
  // Most slippage a BUY may accept, basis points (below 10000).
  uint32 max_buy_slippage_bps = 1;
  // Most slippage an exit (SELL) may accept, basis points (below 10000).
  uint32 max_exit_slippage_bps = 2;
  // Most gas price a transaction may be signed with, wei.
  uint64 max_gas_price_wei = 3;
  // Most gas limit of a BUY.
  uint64 max_buy_gas_limit = 4;
  // Most gas limit of an approval.
  uint64 max_approve_gas_limit = 5;
  // Most gas limit of a SELL.
  uint64 max_sell_gas_limit = 6;
}
// One LIVE position of the ledger: its BUY, exit and native result.
message LivePosition {
  // Token address, 0x hex.
  string token = 1;
  // BSC_EXEC or BSC_STRATEGY_C.
  string component = 2;
  // PENDING, OPEN, EXITING, CLOSED or FAILED.
  string state = 3;
  // Tokens the BUY received, decimal.
  string tokens = 4;
  // The BUY's input, decimal wei.
  string input_wei = 5;
  // The SELL's proceeds, decimal wei.
  string proceeds_wei = 6;
  // Gas of all its included or reverted transactions, decimal wei.
  string gas_wei = 7;
  // Proceeds minus input minus gas once closed (failed: minus gas), signed decimal wei.
  optional string pnl_wei = 8;
  // The lot: its BUY's transaction hash, 0x hex (a token bought again is another lot).
  string lot = 9;
  // REV.1.0 R3b: the operator's decisions the ledger takes of this lot now (RESUME, WRITE_OFF,
  // EXIT_NOW; exit-now also needs BSC_EXEC_LIVE_OPERATOR_EXIT ON), by the ledger's own rule.
  repeated string decisions = 10;
}
// One LIVE transaction whose bytes may have left, and what the chain made of it.
message LiveTransaction {
  // Transaction hash, 0x hex.
  string tx_hash = 1;
  // BUY, APPROVE, SELL or BURN (REV.1.0 R3b: a nonce burn, the buyer's transfer of nothing to
  // itself).
  string intent = 2;
  // Token address, 0x hex.
  string token = 3;
  // The buyer's nonce it used.
  uint64 nonce = 4;
  // RELEASED, UNKNOWN, INCLUDED, REVERTED or REPLACED.
  string state = 5;
  // The block that included it.
  optional uint64 block_number = 6;
  // REV.1.0 R3b: RECEIPT when its chain fact comes from a block the receipt recovery found (final,
  // the second source's; its receipt's, or where its sender's nonce passes it), not from the
  // follower's block; empty otherwise.
  string source = 7;
  // REV.1.0 R3b: the operator requested its nonce burnt (BURN_REQUESTED); the armed runtime burns
  // it while BSC_EXEC_LIVE_NONCE_BURN is ON.
  bool burn_requested = 8;
  // REV.1.0 R3b: the ledger takes a nonce burn of it now (its signed bytes may still land, it is
  // the configured LIVE buyer's), by the ledger's own rule; the switch aside.
  bool burnable = 9;
}
// The BSC LIVE tab (plan 28.10.): the owner's LIVE gate with every precondition and its
// reason, the grant, attempts and spend, the LIVE path of the runtime, positions,
// transactions and the net result. A view of the native owner and ledger, never a permission.
message BscLiveState {
  // CLEAR when the gate holds now, BLOCKED otherwise, UNKNOWN without a readable owner state.
  string gate = 1;
  // The gate's block reasons in order; the first decides.
  repeated string blockers = 2;
  // Every precondition with whether it holds.
  repeated LivePrecondition preconditions = 3;
  // The grant on file; absent without one.
  LiveGrant grant = 4;
  // The owner generation: the compare-and-swap of a grant, revoke or limit request.
  uint64 generation = 5;
  // The runtime mode BSC_RUNTIME_MODE as it holds now.
  ControlSwitch runtime_mode = 6;
  // The economic LIVE switch BSC_ECON_LIVE.
  ControlSwitch economic_live = 7;
  // The daily BUY attempt limit and today's use.
  BuyAttemptLimit daily = 8;
  // The campaign's total BUY attempt limit (at most ten) and its use.
  uint64 total_limit = 9;
  // Total attempts taken, every day and restart counted.
  uint64 total_used = 10;
  // Attempts the current grant took.
  uint64 grant_attempts_used = 11;
  // What the current grant has spent at most (admitted intents), decimal wei.
  string spent_wei = 12;
  // VERIFIED, NONE or INVALID: the LIVE qualification on file.
  string qualification = 13;
  // Why it is not VERIFIED, or its SHA-256.
  string qualification_detail = 14;
  // The runtime's LIVE path: OFF, BLOCKED, ARMED, ENDED and the arming states.
  string path_state = 15;
  // Why the path is in that state.
  string path_reason = 16;
  // BUILDERS or LOOPBACK.
  string route = 17;
  // The buyer wallet, 0x hex.
  string buyer = 18;
  // The buyer's balance at the last probe, decimal wei.
  optional string buyer_balance_wei = 19;
  // Transactions the path released, and of them UNKNOWN.
  uint64 released = 20;
  // Released transactions whose handoff did not complete.
  uint64 unknown = 21;
  // The owner's or the release's last reason to refuse an intent.
  string last_refusal = 22;
  // The ledger's positions.
  repeated LivePosition positions = 23;
  // The ledger's transactions, newest last.
  repeated LiveTransaction transactions = 24;
  // Realized PnL of closed and failed positions, signed decimal wei.
  string realized_pnl_wei = 25;
  // All gas the ledger's transactions paid, decimal wei.
  string gas_wei = 26;
  // Unreadable inputs, made explicit.
  repeated string warnings = 27;
  // Every entity the grant names (runtime, components, venue, sources) as requested and as it
  // holds now under the gate: LIVE only while the gate is clear and the scope names it.
  repeated ControlSwitch scope = 28;
  // The ingress sources a grant can name: those the runtime configuration gives an adapter
  // endpoint (BSC_INGRESS_<ID>_WSS); a source without one never sights a launch and can never be
  // qualified. In source order; empty without a readable runtime configuration.
  repeated string grantable_sources = 29;
  // REV.1.0 R2b: the LIVE campaign verdict as its record (bsc_runtime live attempts) holds it;
  // absent before any evaluation. Campaign evidence only, never a release or a permission.
  LiveCampaign campaign = 30;
  // The evaluated LIVE BUY attempts in their order, as their records hold them; at most the
  // campaign's total BUY attempt limit (MAX_BUY_ATTEMPTS_TOTAL), more is a warning.
  // Beyond it, the shown ones are the first by ordinal of the limit plus one first by transaction.
  repeated LiveAttempt attempts = 31;
  // REV.1.0 R1/R3b: the open LIVE lots no strategy holds yet (their curve being read), as the
  // runtime's status names them, 0x token.
  repeated string exit_undecided = 32;
  // The open LIVE lots no strategy exit can take, "0x<token> <REASON>".
  repeated string stranded = 33;
  // The curve reads of open lots that failed in the runtime's process.
  uint64 lot_read_faults = 34;
  // The last of those failures; empty without one.
  string lot_read_fault = 35;
  // REV.1.0 R3b (BSC3-024/041): the ledger's unresolved transactions the runtime's receipt
  // recovery asked about and has not resolved, "0x<tx> <REASON>".
  repeated string recovery_pending = 36;
  // The transactions the receipt recovery resolved in the runtime's process.
  uint64 recovered = 37;
  // The receipt recovery's failed reads in the runtime's process.
  uint64 recovery_faults = 38;
  // The last of those failures; empty without one.
  string recovery_fault = 39;
  // REV.1.0 R3b: the LIVE ledger's version, its next entry's number (never reused): the
  // compare-and-swap (config_version) of an operator's lot decision or nonce burn, read before
  // the positions and transactions shown; absent while the ledger is unreadable.
  optional uint64 ledger_version = 40;
  // BSC_EXEC_LIVE_OPERATOR_EXIT of the runtime configuration: a lot's EXIT_NOW is locked while
  // false; absent without a readable configuration with the executor.
  optional bool operator_exit = 41;
  // BSC_EXEC_LIVE_NONCE_BURN of the runtime configuration: a nonce burn is locked while false;
  // absent without a readable configuration with the executor.
  optional bool nonce_burn = 42;
  // The lowest sequence number of the ledger's entries that do not decode: the one the operator
  // may quarantine next (bsc.live.ledger.quarantine); the warning LIVE_LEDGER_INVALID counts
  // them all. Absent while every entry decodes.
  optional uint64 first_unreadable = 43;
}
// One cell of the LIVE campaign (REV.1.0 R2), as the verdict record holds it.
message LiveCampaignCell {
  // EXTERNAL_FULL_LAUNCH or SELF_LAUNCH.
  string cell = 1;
  // Whether the manifest enables it.
  bool enabled = 2;
  // The manifest's minimum attempts; absent when it names none.
  optional uint64 min_attempts = 3;
  // Its attempts.
  uint64 attempts = 4;
  // Of them passed.
  uint64 passed = 5;
  // Of them failed.
  uint64 failed = 6;
  // Of them undecided.
  uint64 undecided = 7;
  // The manifest's minimum duration, seconds; absent when it names none.
  optional uint64 min_duration_s = 8;
  // How long it ran, seconds.
  uint64 duration_s = 9;
  // Its verdict.
  string verdict = 10;
}
// The LIVE campaign verdict (REV.1.0 R2, master plan §13 J), unchanged from its record: the
// evaluator decides, the reporter only reads. Every count's denominator is another count here.
message LiveCampaign {
  // CAMPAIGN_NOT_READY, CAMPAIGN_OPEN, CAMPAIGN_FAIL or CAMPAIGN_PASS.
  string verdict = 1;
  // RELEASE_EVIDENCE_NOT_READY or RELEASE_EVIDENCE_PASS: the campaign evidence only; a release
  // also needs the implementation matrix, runtime enforcement and LIVE authorization.
  string release_evidence = 2;
  // Why the verdict is not a pass, in the evaluator's order; with skip_reasons at most the
  // verdict's share of the state (LIVE_CAMPAIGN_REASONS_BEYOND_LIMIT counts the rest).
  repeated string reasons = 3;
  // The enabled cells' minimum attempts, summed.
  uint64 planned = 4;
  // The canonical C1-scope Flap launches since the commitment.
  uint64 observed = 5;
  // Of them seen in full before their block (actionable).
  uint64 selected = 6;
  // C3 BUYs the owner admitted (written and withdrawn).
  uint64 admitted = 7;
  // Observed launches without an attempt.
  uint64 skipped = 8;
  // C3 BUYs written after the commitment: the campaign's attempts.
  uint64 written = 9;
  // Of them acquired.
  uint64 acquired = 10;
  // Of them reverted.
  uint64 reverted = 11;
  // Of them dropped.
  uint64 dropped = 12;
  // Of them late or in another block.
  uint64 late = 13;
  // Of them not resolved by the chain.
  uint64 unresolved = 14;
  // Of them passed.
  uint64 passed = 15;
  // Of them failed.
  uint64 failed = 16;
  // Of them undecided.
  uint64 undecided = 17;
  // The longest run of observed launches without an attempt.
  uint64 consecutive_misses = 18;
  // C3 BUYs written before the commitment (not the campaign's).
  uint64 before_precommit = 19;
  // Launches whose transaction could not be verified (coverage unknown).
  uint64 unverifiable = 20;
  // The time the campaign's sealed runs cover, seconds.
  uint64 covered_s = 21;
  // The rest of its span, seconds.
  uint64 uncovered_s = 22;
  // The covered share of its span, ppm.
  uint64 covered_ppm = 23;
  // The skipped launches by how they were seen, CLASS=count.
  repeated string skip_reasons = 24;
  // The cells of the manifest.
  repeated LiveCampaignCell cells = 25;
  // SHA-256 of the rated manifest, lowercase hex; empty without one.
  string manifest_sha256 = 26;
  // SHA-256 of its precommitment record, lowercase hex; empty without one.
  string precommit_sha256 = 27;
  // SHA-256 of the evaluating bsc_runtime build, lowercase hex (zero when unknown).
  string build_sha256 = 28;
  // When the evaluation wrote the record, unix milliseconds.
  uint64 evaluated_unix_ms = 29;
  // SHA-256 of the verdict record's bytes, lowercase hex.
  string record_sha256 = 30;
}
// One adapter of a LIVE attempt's dispatch and its answer.
message LiveAttemptAdapter {
  // The granted builder, e.g. CLUB48_BUILDER_V1; empty when the record names none.
  string builder = 1;
  // The dispatch outcome at this adapter.
  string outcome = 2;
  // The builder's answer; empty without one.
  string answer = 3;
  // The adapter's index in the runtime's dispatch.
  uint64 adapter = 4;
  // The boundary its send time is taken at.
  string boundary = 5;
  // Whether its record and its transport qualify that boundary as the send time.
  bool qualified = 6;
  // Its write check on the runtime's clock, ns; absent without one.
  optional uint64 t_write_check_ns = 7;
  // Its boundary on the runtime's clock, ns; absent without one.
  optional uint64 t_boundary_ns = 8;
  // Its queueing on the runtime's clock, ns; absent without one.
  optional uint64 t_queue_ns = 9;
  // Its answer on the runtime's clock, ns; absent without one.
  optional uint64 t_answer_ns = 10;
}
// One evaluated LIVE BUY attempt (REV.1.0 R2), unchanged from its record. T0 is never the
// producer's unless the record says t0_exact: without its witness the timing verdict is UNKNOWN.
message LiveAttempt {
  // 15 was window_complete, a reading of the window state; window (31) is the state as written.
  reserved 15;
  reserved "window_complete";
  // Its place among the evaluated BUYs, from 1.
  uint64 ordinal = 1;
  // The BUY's transaction hash, 0x hex.
  string tx = 2;
  // C3_BUY or STRATEGY_BUY.
  string kind = 3;
  // EXTERNAL_FULL_LAUNCH, SELF_LAUNCH or STRATEGY_ENTRY.
  string cell = 4;
  // RELEASED, UNKNOWN, INCLUDED, REVERTED, REPLACED or DROPPED.
  string state = 5;
  // The attempt's verdict: PASS, FAIL, UNKNOWN or NOT_APPLICABLE.
  string verdict = 6;
  // The acquisition's verdict.
  string acquisition = 7;
  // The canonical inclusion's verdict.
  string canonical = 8;
  // The producer's T0 to T_buy: UNKNOWN without its witness.
  string timing = 9;
  // The placement's verdict.
  string placement = 10;
  // The capture's verdict.
  string capture = 11;
  // The local start deadline and a qualified send time.
  string local = 12;
  // The economics' verdict.
  string economics = 13;
  // Why, in the evaluator's order; at most the attempt's share of the state
  // (LIVE_ATTEMPT_REASONS_BEYOND_LIMIT counts the rest).
  repeated string reasons = 14;
  // Why the window is not complete; empty when complete.
  string window_why = 16;
  // Trades of the token in the window.
  uint64 trades = 17;
  // Of them BUYs.
  uint64 buys = 18;
  // Of them SELLs.
  uint64 sells = 19;
  // Native wei per 10^18 token units of the first other trader's BUY, decimal; absent without one.
  optional string first_external_price = 20;
  // Its own price per token against that BUY's, ppm; absent without both.
  optional uint64 price_vs_first_external_ppm = 21;
  // Local timing on the runtime's clock, ingress (or decision) to the first qualified send, ns.
  optional uint64 ingress_to_send_ns = 22;
  // Selection to the first qualified send, ns.
  optional uint64 select_to_send_ns = 23;
  // The first qualified send to the first acknowledgement, ns.
  optional uint64 send_to_ack_ns = 24;
  // Counters of every attempt up to this one: the LIVE BUYs (C3 and Strategy C, before the
  // commitment too), the acquisition rate's denominator.
  uint64 attempts = 25;
  // Of them acquired.
  uint64 acquired = 26;
  // C3 BUYs among them whose verdict is PASS (a count, not a rate: a Strategy C BUY has no
  // verdict, NOT_APPLICABLE).
  uint64 passed = 27;
  // C3 BUYs among them whose verdict is FAIL.
  uint64 failed = 28;
  // C3 BUYs among them whose verdict is UNKNOWN.
  uint64 undecided = 29;
  // The adapters of its dispatch.
  repeated LiveAttemptAdapter adapters = 30;
  // The 15-s market window from the launch's block as written: COMPLETE or INCOMPLETE.
  string window = 31;
  // The attempt's identity (its lease attempt, or its hash), 0x hex.
  string attempt = 32;
  // The run whose journal holds its release; absent without a release record.
  optional uint64 run = 33;
  // The token, 0x hex.
  string token = 34;
  // The launch's transaction hash, 0x hex; empty without a launch (Strategy C).
  string launch_hash = 35;
  // The source whose sighting triggered it (a C3 BUY); empty without one.
  string trigger = 36;
  // Its block's number; absent while not included.
  optional uint64 block_number = 37;
  // Its block's hash, 0x hex; empty while not included.
  string block_hash = 38;
  // Its block's header time, unix ms; absent while not included.
  optional uint64 block_ms = 39;
  // Tokens its own Portal BUY acquired, decimal token units; absent when unknown.
  optional string tokens = 40;
  // The native amount its included BUY spent, decimal wei; absent when unknown.
  optional string eth_wei = 41;
  // Gas its inclusion paid, decimal wei; absent when unknown.
  optional string gas_wei = 42;
  // Its own price, native wei per 10^18 token units, decimal; absent without its own trade.
  optional string own_price = 43;
  // The ledger's PLACED fact: FIRST, LATE, OTHER_BLOCK or NO_TOKENS; empty without one.
  string placed = 44;
  // The launch's transaction index in its block; absent when the launch is not in it.
  optional uint64 launch_index = 45;
  // Its own transaction index in its block; absent without a PLACED fact.
  optional uint64 own_index = 46;
  // Other traders' BUYs of the token between the launch and it; absent without a PLACED fact.
  optional uint64 buys_before = 47;
  // The runtime clock the local times are on; absent without a release record.
  optional uint64 clock_id = 48;
  // Ingress (C3) or decision (Strategy C) on that clock, ns; absent without a release record.
  optional uint64 t_ingress_ns = 49;
  // Selection on that clock, ns; absent without a release record.
  optional uint64 t_select_ns = 50;
  // The first qualified send among its adapters on that clock, ns; absent without one.
  optional uint64 t_send_ns = 51;
  // The first acknowledgement on that clock, ns; absent without one.
  optional uint64 t_ack_ns = 52;
  // Local start deadlines it missed; absent without a release record.
  optional uint64 deadline_misses = 53;
  // The market window's length, ms.
  uint64 window_ms = 54;
  // The launch's block; absent without one.
  optional uint64 launch_block = 55;
  // The launch block's header time, unix ms (the window's start); absent without one.
  optional uint64 launch_ms = 56;
  // The last block inside the window; absent while the window is not over.
  optional uint64 window_end_block = 57;
  // Whether T0 is the producer's exact time (never so without its witness).
  bool t0_exact = 58;
  // The first other trader's BUY in the window, 0x hex; empty without one.
  string first_external_buy_tx = 59;
  // Its block; absent without one.
  optional uint64 first_external_buy_block = 60;
  // Its transaction index in that block; absent without one.
  optional uint64 first_external_buy_index = 61;
  // The native volume of the token's BUYs in the window (its own too), decimal wei.
  string buy_wei = 62;
  // The native volume of the token's SELLs in the window, decimal wei.
  string sell_wei = 63;
  // When its evaluation wrote the record, unix ms: the campaign verdict's evaluated_unix_ms
  // when both are of one evaluation.
  uint64 evaluated_unix_ms = 64;
}
// The parameters of `bsc.live.grant`: the scope the operator confirmed and its digest.
message BscLiveGrantCommand {
  // The venue, e.g. BSC_VENUE_FLAP.
  string venue = 1;
  // C3, STRATEGY_C or C3+STRATEGY_C.
  string strategies = 2;
  // Source IDs.
  repeated string sources = 3;
  // Adapter names.
  repeated string adapters = 4;
  // Largest BUY input, decimal wei.
  string max_input_wei = 5;
  // Whole spend limit, decimal wei.
  string max_spend_wei = 6;
  // BUY attempts the grant may take.
  uint32 max_attempts = 7;
  // Expiry, unix milliseconds.
  uint64 expires_unix_ms = 8;
  // SHA-256 of the canonical scope text the operator was shown, lowercase hex.
  string scope_sha256 = 9;
  // A separate authorization of the exits of open positions only, no BUY (BSC3-058).
  bool exit_only = 10;
  // The execution risk the operator grants (BSC3-069), every bound; required.
  LiveGrantRisk risk = 11;
  // The positions and losses the operator grants (31.10. order), every bound; required.
  LiveGrantLimits limits = 12;
}
