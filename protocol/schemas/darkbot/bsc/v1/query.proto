syntax = "proto3";
package darkbot.bsc.v1;

import "darkbot/bsc/v1/common.proto";
import "darkbot/bsc/v1/history.proto";
import "darkbot/bsc/v1/training.proto";
import "darkbot/bsc/v1/wallet.proto";
import "darkbot/bsc/v1/watch.proto";

// V8 bounded read-only queries (BSC-V8-10, Wire V1.3 §7 shape). The gateway route is registered
// (gateway/src/control.rs `bsc_query`) and answered by the deployed reporter (`bsc-status-reporter
// --query`, the request on stdin, read-only): strategy_settings by its native owner, every other
// query NOT_IMPLEMENTED with its missing BSC-V8 owner in unavailable_reason.
//   POST /api/v1/bsc/query   Content-Type: application/x-protobuf   Body: BscQueryRequest
//   Answer                   Content-Type: application/x-protobuf   Body: BscQueryResponse, Cache-Control no-store
//   Header: X-CSRF-Token of the session bootstrap (required); session cookie HttpOnly, SameSite=Strict.
// Like a command: the session, an allowed Origin and Sec-Fetch-Site; the body at most
// Limits.max_client_frame_bytes; an undecodable request is 400; no answer within
// DARKBOT_GATEWAY_BSC_QUERY_TIMEOUT_MS or one larger than DARKBOT_GATEWAY_BSC_QUERY_MAX_ANSWER_BYTES
// is 503 (never truncated).
// One request per operator view or page step, never polling; history never on a STATE topic
// (BscLiveState stays bounded, topic 40 stays reserved). The gateway checks session, origin, host
// and CSRF and bounds the body; the native owner reads its journals (an index only as a rebuildable
// cache) and binds every cursor to (its snapshot, the filter digest, the sort). A limit 0 asks for
// the owner's default. A query the owner cannot answer as asked is refused with a QueryRefusal,
// never answered with another page. The frontend shows a query without its owner as
// NOT_IMPLEMENTED, a failed one as UNAVAILABLE; it never substitutes data.

// Why the owner refused a query.
enum QueryRefusal {
  // No refusal.
  QUERY_REFUSAL_UNSPECIFIED = 0;
  // The cursor's snapshot is gone (compaction, restart): start again from the first page.
  QUERY_REFUSAL_CURSOR_STALE = 1;
  // The cursor is not the owner's, or belongs to another filter or sort.
  QUERY_REFUSAL_CURSOR_INVALID = 2;
  // The limit is above the owner's cap.
  QUERY_REFUSAL_LIMIT_EXCEEDED = 3;
  // A filter value the owner does not accept (unknown state, venue or kind, a reversed period).
  QUERY_REFUSAL_INVALID_FILTER = 4;
}

// One bounded query.
message BscQueryRequest {
  // Client-generated identity for correlation (UUIDv4); a query changes nothing.
  string request_id = 1;
  // The query.
  oneof query {
    // A page of LIVE trades.
    TradeHistoryQuery trades = 2;
    // One lot's detail.
    TradeDetailQuery trade = 3;
    // A page of training runs.
    TrainingRunQuery training_runs = 4;
    // The training profiles.
    TrainingProfilesQuery training_profiles = 5;
    // A page of wallet movements.
    WalletHistoryQuery wallet_movements = 6;
    // The treasury state.
    WalletTreasuryQuery treasury = 7;
    // One performance series.
    PerformanceSeriesQuery series = 8;
    // The WATCH projection (REV.2.0).
    BscWatchQuery watch = 9;
    // The stored and running Strategy C configuration.
    StrategyCSettingsQuery strategy_settings = 10;
    // A page of the replay catalogue.
    ReplaySourceQuery replay_sources = 11;
  }
}

// The answer to one query.
message BscQueryResponse {
  // Echo of the request.
  string request_id = 1;
  // Whether the native owner answered.
  Availability availability = 2;
  // Why it is not AVAILABLE.
  string unavailable_reason = 3;
  // The result, of the query's kind.
  oneof result {
    // A page of LIVE trades.
    TradeHistoryPage trades = 4;
    // One lot's detail.
    TradeDetail trade = 5;
    // A page of training runs.
    TrainingRunPage training_runs = 6;
    // The training profiles.
    TrainingProfiles training_profiles = 7;
    // A page of wallet movements.
    WalletHistoryPage wallet_movements = 8;
    // The treasury state.
    WalletTreasuryState treasury = 9;
    // One performance series.
    PerformanceSeries series = 10;
    // The WATCH projection (REV.2.0).
    BscWatchState watch = 11;
    // The stored and running Strategy C configuration.
    StrategyCSettingsState strategy_settings = 12;
    // A page of the replay catalogue.
    ReplaySourcePage replay_sources = 13;
  }
  // Why the owner refused the query (no result then); UNSPECIFIED otherwise.
  QueryRefusal refusal = 14;
  // The owner's detail of the refusal; empty without one.
  string refusal_detail = 15;
}
